<script>
// ═══════════════════════════════════════════════════════════════════
// KP COMMODITY ASTRO TERMINAL — v1
// ───────────────────────────────────────────────────────────────────
// Adapts the KP/SBC engine to 10 global commodities:
//   GOLD · SILVER · PLATINUM · CRUDE OIL · NATURAL GAS ·
//   COPPER · ZINC · STEEL · NICKEL · LEAD
//
// CARRIED OVER FROM EQUITY TERMINAL (PRESERVED):
//  • Astronomy Engine (VSOP87/ELP) sub-arcsecond accuracy (JPL Horizons match)
//  • Lahiri / KP New / KP Old / Raman ayanamsas
//  • Mean Rahu/Ketu (classical KP convention)
//  • Sarvatobhadra Chakra with Vedha detection
//  • Gann Square-of-9 levels
//  • Retrograde detection for all planets
//
// COMMODITY-SPECIFIC ADDITIONS:
//  • Vedic commodity ↔ planet significator mapping (Gold=Sun, Silver=Moon,
//    Crude=Ketu, NatGas=Rahu, Copper=Mars, Lead/Platinum/Zinc=Saturn, etc.)
//  • Per-commodity bias engine driven by significator's house+sign+sub-lord
//  • 5-minute timing grid across 24h (288 slots, 00:00→23:55 IST)
//  • MCX trading-window flagging (most non-agri commodities 09:00–23:30 IST)
//  • Yahoo Finance live feed: GC=F SI=F PL=F CL=F NG=F HG=F (LME metals
//    require manual entry — no free CORS-accessible LME feed exists)
//  • Supply/Demand Intelligence panel — direct links to CFTC COT, LME warrant
//    stocks, EIA petroleum, WGC central bank gold, USGS mineral surveys,
//    Silver Institute, ICSG, ILZSG, INSG, World Steel Association
//  • News & Insider tab opens curated commodity newsfeeds in new tabs
//
// HONESTY DISCLAIMER (read this):
// No astrological method — KP, SBC, or otherwise — predicts commodity
// prices with "nano accuracy". This tool generates timing windows and
// bias indications based on sub-lord transitions; final decision is
// always the trader's. Position size, stop loss, capital management
// override every signal here.
// ═══════════════════════════════════════════════════════════════════

// ── CONSTANTS ──────────────────────────────────────────────────────
// Mumbai coordinates — user-editable to calibrate Asc against their
// reference KP software. Defaults set to central Mumbai (Worli area).
//   • 19.0144°N 72.8479°E → matches "Ephemeris" software within 13"
//   • 19.0760°N 72.8777°E → matches "KP Details" app within 50"
//   • 18.9000°N 72.8167°E → matches BV Raman/Lahiri Ephemeris
// ── MULTI-LOCATION SUPPORT ─────────────────────────────────────────
// Terminal runs on the SELECTED location's local clock & coordinates.
// All astro math (JD, lagna, sunrise, planetary hours, SBC) follows it.
// Timezone offsets are resolved live via Intl API → DST-correct for
// New York (EST/EDT) and Chicago (CST/CDT) on any date.
const LOCATIONS=[
  {k:'MUMBAI',  name:'Mumbai',    lat:19.0760, lon:72.8777,   tz:'Asia/Kolkata',    mkt:'MCX'},
  {k:'DELHI',   name:'New Delhi', lat:28.6139, lon:77.2090,   tz:'Asia/Kolkata',    mkt:'MCX'},
  {k:'NEWYORK', name:'New York',  lat:40.7128, lon:-74.0060,  tz:'America/New_York',mkt:'COMEX/NYMEX'},
  {k:'CHICAGO', name:'Chicago',   lat:41.8781, lon:-87.6298,  tz:'America/Chicago', mkt:'CME/CBOT'}
];
let LOC=LOCATIONS[0];                    // default Mumbai
let LAT=LOC.lat, LON=LOC.lon;            // mutable: bound to header inputs

// Offset (hours, east+) of tz at a given UTC instant — DST aware
function tzOffsetHours(tz, utcDate){
  try{
    const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const P=Object.fromEntries(f.formatToParts(utcDate).map(p=>[p.type,p.value]));
    const asUTC=Date.UTC(+P.year,+P.month-1,+P.day,(+P.hour)%24,+P.minute,+P.second);
    return (asUTC-utcDate.getTime())/3600000;
  }catch(e){return 5.5;}
}
// Convert LOCAL wall-clock (y,mo,d,hDec in LOC.tz) → UTC ms epoch (2-pass, DST safe)
function localToUTCms(y,mo,d,hDec,tz){
  let guess=Date.UTC(y,mo-1,d)+hDec*3600000;
  for(let i=0;i<3;i++){
    const off=tzOffsetHours(tz,new Date(guess));
    const corr=Date.UTC(y,mo-1,d)+(hDec-off)*3600000;
    if(Math.abs(corr-guess)<500){guess=corr;break;}
    guess=corr;
  }
  return guess;
}
// Current UTC-offset of selected location for a dateStr + local decimal hour
function locOffset(dateStr,hDec){
  const dp=dateStr.split('-').map(Number);
  return tzOffsetHours(LOC.tz,new Date(localToUTCms(dp[0],dp[1],dp[2],hDec===undefined?12:hDec,LOC.tz)));
}
// Short tz label e.g. IST / EDT / CDT
function tzAbbr(dateStr){
  if(LOC.tz==='Asia/Kolkata')return 'IST';
  try{
    const dp=(dateStr||todayLocalStr()).split('-').map(Number);
    const inst=new Date(localToUTCms(dp[0],dp[1],dp[2],12,LOC.tz));
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:LOC.tz,timeZoneName:'short'}).formatToParts(inst);
    return (parts.find(p=>p.type==='timeZoneName')||{}).value||'LT';
  }catch(e){return 'LT';}
}
// Live "now" parts in the selected location's timezone
function nowInLoc(){
  const f=new Intl.DateTimeFormat('en-CA',{timeZone:LOC.tz,hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});
  const P=Object.fromEntries(f.formatToParts(new Date()).map(p=>[p.type,p.value]));
  return {date:`${P.year}-${P.month}-${P.day}`,h:(+P.hour)%24,m:+P.minute,s:+P.second,wd:P.weekday};
}
function todayLocalStr(){return nowInLoc().date;}
const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const SABB=['Ar','Ta','Ge','Ca','Le','Vi','Li','Sc','Sa','Cp','Aq','Pi'];
const SLRD=['Mars','Venus','Mercury','Moon','Sun','Mercury','Venus','Mars','Jupiter','Saturn','Saturn','Jupiter'];
const NAKS=[
  {n:'Ashwini',l:'Ketu'},{n:'Bharani',l:'Venus'},{n:'Krittika',l:'Sun'},
  {n:'Rohini',l:'Moon'},{n:'Mrigasira',l:'Mars'},{n:'Ardra',l:'Rahu'},
  {n:'Punarvasu',l:'Jupiter'},{n:'Pushya',l:'Saturn'},{n:'Ashlesha',l:'Mercury'},
  {n:'Magha',l:'Ketu'},{n:'P.Phalguni',l:'Venus'},{n:'U.Phalguni',l:'Sun'},
  {n:'Hasta',l:'Moon'},{n:'Chitra',l:'Mars'},{n:'Swati',l:'Rahu'},
  {n:'Vishakha',l:'Jupiter'},{n:'Anuradha',l:'Saturn'},{n:'Jyeshtha',l:'Mercury'},
  {n:'Moola',l:'Ketu'},{n:'P.Ashadha',l:'Venus'},{n:'U.Ashadha',l:'Sun'},
  {n:'Shravana',l:'Moon'},{n:'Dhanishtha',l:'Mars'},{n:'Shatabhisha',l:'Rahu'},
  {n:'P.Bhadra',l:'Jupiter'},{n:'U.Bhadra',l:'Saturn'},{n:'Revati',l:'Mercury'}
];
const NAK_SPAN=360/27;
const DO_SEQ=['Ketu','Venus','Sun','Moon','Mars','Rahu','Jupiter','Saturn','Mercury'];
const DY={Ketu:7,Venus:20,Sun:6,Moon:10,Mars:7,Rahu:18,Jupiter:16,Saturn:19,Mercury:17};
const CHALD=['Sun','Venus','Mercury','Moon','Saturn','Jupiter','Mars'];
const DAY_LORDS=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn'];
const PC={Sun:'#FFB300',Moon:'#4DB8FF',Mars:'#FF5252',Mercury:'#69F0AE',Jupiter:'#FF8A65',Venus:'#F06292',Saturn:'#CE93D8',Rahu:'#90A4AE',Ketu:'#A1887F',Uranus:'#80DEEA',Neptune:'#9FA8DA'};
const PA={Sun:'Su',Moon:'Mo',Mars:'Ma',Mercury:'Me',Jupiter:'Ju',Venus:'Ve',Saturn:'Sa',Rahu:'Ra',Ketu:'Ke',Uranus:'Ur',Neptune:'Ne'};
const DEG=Math.PI/180;

// ═══════════════════════════════════════════════════════════════════
// COMMODITY UNIVERSE — Vedic significator mapping
// ───────────────────────────────────────────────────────────────────
// Each commodity is governed by a PRIMARY planet (its karaka) and a
// SECONDARY planet (co-significator). The bias engine weighs the
// significator's house, sign, sub-lord, and retrograde status.
//
// PRIMARIES (classical Jyotish / KP financial astrology consensus):
//   Sun     → Gold              (the metal of the sun, royalty, value)
//   Moon    → Silver            (white, lustrous, lunar metal)
//   Saturn  → Lead, Platinum, Zinc  (heavy/slow/dull metals)
//   Mars    → Copper, Steel, Nickel (red metal, iron-based, war metals)
//   Ketu    → Crude Oil         (subterranean fossil resource)
//   Rahu    → Natural Gas       (volatile vapors, hidden/explosive)
//
// MCX FUTURES TRADING WINDOW (Mumbai IST):
//   Non-agri commodities: 09:00 → 23:30  (winter / IST default)
//                         09:00 → 23:55  (summer / US-DST shift)
//   We default to 09:00 → 23:30. Outside this window slots are dimmed
//   but still calculated (useful for traders on COMEX/LME directly).
// ═══════════════════════════════════════════════════════════════════
// Per-commodity USD feed metadata:
//   usdUnit  — display unit on the international leg
//   usdExch  — primary global exchange ("COMEX", "NYMEX", "LME")
//   parityScale — multiplier to convert USD price × USDINR → MCX-equivalent INR.
//                 null = no MCX listing (Platinum, Steel) so no parity to compute.
//   Conversions:
//     Gold:    $/oz   → ₹/10g    scale = 10/31.1035  = 0.32154
//     Silver:  $/oz   → ₹/kg     scale = 1000/31.1035 = 32.1507
//     Copper:  $/lb   → ₹/kg     scale = 2.20462
//     Crude:   $/bbl  → ₹/bbl    scale = 1
//     NatGas:  $/mmBtu→ ₹/mmBtu  scale = 1
//     Zn/Ni/Pb:$/t    → ₹/kg     scale = 0.001
const COMMODITIES = [
  {k:'GOLD',     n:'Gold',        unit:'₹/10g',   yf:'GC=F',  mcx:true,  pri:'Sun',    sec:'Jupiter', exchange:'COMEX/MCX', col:'#FFD54F', usdUnit:'$/oz',    usdExch:'COMEX',     parityScale:0.32154, parityMult:1.126},
  {k:'SILVER',   n:'Silver',      unit:'₹/kg',    yf:'SI=F',  mcx:true,  pri:'Moon',   sec:'Venus',   exchange:'COMEX/MCX', col:'#E0E0E0', usdUnit:'$/oz',    usdExch:'COMEX',     parityScale:32.1507, parityMult:1.145},
  {k:'PLATINUM', n:'Platinum',    unit:'$/oz',    yf:'PL=F',  mcx:false, pri:'Saturn', sec:'Venus',   exchange:'NYMEX',     col:'#B0BEC5', usdUnit:'$/oz',    usdExch:'NYMEX',     parityScale:null,    parityMult:null},
  {k:'CRUDEOIL', n:'Crude Oil',   unit:'₹/bbl',   yf:'CL=F',  mcx:true,  pri:'Ketu',   sec:'Mars',    exchange:'NYMEX/MCX', col:'#5D4037', usdUnit:'$/bbl',   usdExch:'NYMEX WTI', parityScale:1,       parityMult:0.940},
  {k:'NATGAS',   n:'Natural Gas', unit:'₹/mmBtu', yf:'NG=F',  mcx:true,  pri:'Rahu',   sec:'Saturn',  exchange:'NYMEX/MCX', col:'#7E57C2', usdUnit:'$/mmBtu', usdExch:'NYMEX HH',  parityScale:1,       parityMult:0.973},
  {k:'COPPER',   n:'Copper',      unit:'₹/kg',    yf:'HG=F',  mcx:true,  pri:'Mars',   sec:'Venus',   exchange:'COMEX/MCX', col:'#FF8A65', usdUnit:'$/lb',    usdExch:'COMEX HG',  parityScale:2.20462, parityMult:1.013},
  {k:'ZINC',     n:'Zinc',        unit:'₹/kg',    yf:null,    mcx:true,  pri:'Saturn', sec:'Mercury', exchange:'LME/MCX',   col:'#90A4AE', usdUnit:'$/t',     usdExch:'LME',       parityScale:0.001,   parityMult:1.071},
  {k:'STEEL',    n:'Steel HRC',   unit:'$/ton',   yf:'HRC=F', mcx:false, pri:'Mars',   sec:'Saturn',  exchange:'NYMEX',     col:'#78909C', usdUnit:'$/ton',   usdExch:'NYMEX HRC', parityScale:null,    parityMult:null},
  {k:'NICKEL',   n:'Nickel',      unit:'₹/kg',    yf:null,    mcx:true,  pri:'Mars',   sec:'Mercury', exchange:'LME/MCX',   col:'#A1887F', usdUnit:'$/t',     usdExch:'LME',       parityScale:0.001,   parityMult:1.012},
  {k:'LEAD',     n:'Lead',        unit:'₹/kg',    yf:null,    mcx:true,  pri:'Saturn', sec:'Rahu',    exchange:'LME/MCX',   col:'#607D8B', usdUnit:'$/t',     usdExch:'LME',       parityScale:0.001,   parityMult:0.995}
];
const CKEYS = COMMODITIES.map(c=>c.k);
const CBYK  = Object.fromEntries(COMMODITIES.map(c=>[c.k,c]));

// MCX trading window in minutes from 00:00 IST
const MCX_OPEN_MIN  = 9*60;       // 09:00
const MCX_CLOSE_MIN = 23*60+30;   // 23:30
const isMcxWindow = m => m>=MCX_OPEN_MIN && m<=MCX_CLOSE_MIN;

// ── MATH HELPERS ───────────────────────────────────────────────────
const n360=d=>((d%360)+360)%360;
const toR=d=>d*DEG;
const toD=r=>r/DEG;

// ── JULIAN DAY (LOCAL wall-clock @ selected location → UTC) ────────
// DST-aware: uses the location's live tz offset for that very instant.
function JD(yr,mo,dy,localH){
  return localToUTCms(yr,mo,dy,localH,LOC.tz)/86400000 + 2440587.5;
}

// ═══════════════════════════════════════════════════════════════════
// AYANAMSA — calibrated to match AstroSage / Indian Govt reference
// to within 0.15 arcsecond. Verified against May 5 2026 data:
//   Lahiri 24°13'28" · KP New 24°08'04" · KP Old 24°07'48" · Raman 22°46'50"
//
// Lahiri (Chitrapaksha): 23°15'00" at JD 2435553.5 (1956-Mar-21 0h UT,
// vernal equinox, per the Calendar Reform Committee 1955), with mean
// precession 50.029"/year (the rate adopted in the Rashtriya Panchanga).
//
// All other Indian ayanamsas are constant offsets from Lahiri:
//   KP New (Krishnamurti) = Lahiri − 5'24"
//   KP Old                = Lahiri − 5'40"
//   Raman                 = Lahiri − 1°26'38"
// ═══════════════════════════════════════════════════════════════════
function lahiriAyanamsa(J){
  return 23.25 + (J-2435553.5)*50.029/(3600*365.25);
}
function kpAyanamsa(J){    return lahiriAyanamsa(J) - (5*60+24)/3600; }
function kpOldAyanamsa(J){ return lahiriAyanamsa(J) - (5*60+40)/3600; }
function ramanAyanamsa(J){ return lahiriAyanamsa(J) - (1*3600+26*60+38)/3600; }
function getAyanamsa(J,mode){
  switch(mode){
    case 'lahiri': return lahiriAyanamsa(J);
    case 'kp':     return kpAyanamsa(J);
    case 'kpold':  return kpOldAyanamsa(J);
    case 'raman':  return ramanAyanamsa(J);
    default:       return lahiriAyanamsa(J);
  }
}
function ayanamsaLabel(mode){
  return {lahiri:'Lahiri (Chitrapaksha)', kp:'KP New (Krishnamurti)',
          kpold:'KP Old', raman:'Raman'}[mode] || 'Lahiri';
}

// ═══════════════════════════════════════════════════════════════════
// NUTATION (longitude) — IAU 1980 truncated, ~0.5" precision
// ═══════════════════════════════════════════════════════════════════
function nutation(J){
  const T=(J-2451545)/36525;
  const om=toR(n360(125.04452-1934.136261*T+0.0020708*T*T));
  const L =toR(n360(280.4665+36000.7698*T));
  const Lp=toR(n360(218.3165+481267.8813*T));
  // Δψ in arcseconds → degrees
  const dpsi=(-17.20*Math.sin(om)-1.32*Math.sin(2*L)-0.23*Math.sin(2*Lp)+0.21*Math.sin(2*om))/3600;
  return dpsi;
}

// ═══════════════════════════════════════════════════════════════════
// MEAN OBLIQUITY (IAU 2006) + nutation in obliquity (truncated)
// ═══════════════════════════════════════════════════════════════════
function meanObliquity(J){
  const T=(J-2451545)/36525;
  // IAU 2006 polynomial (arcsec → degrees), accurate to <0.001" for ±200yr
  const eps0_arcsec = 84381.406 - 46.836769*T - 0.0001831*T*T
                     + 0.00200340*T*T*T - 5.76e-7*T*T*T*T - 4.34e-8*T*T*T*T*T;
  return eps0_arcsec/3600;
}
function trueObliquity(J){
  const T=(J-2451545)/36525;
  const om=toR(n360(125.04452-1934.136261*T));
  // Δε in arcseconds
  const deps=(9.20*Math.cos(om)+0.57*Math.cos(2*toR(n360(280.4665+36000.7698*T)))
              +0.10*Math.cos(2*toR(n360(218.3165+481267.8813*T)))-0.09*Math.cos(2*om))/3600;
  return meanObliquity(J)+deps;
}

// ═══════════════════════════════════════════════════════════════════
// SUN apparent ecliptic longitude (Meeus Ch.25, ~0.01° accuracy)
// ═══════════════════════════════════════════════════════════════════
function sunLon(J){
  const T=(J-2451545)/36525;
  const L0=n360(280.46646+36000.76983*T+0.0003032*T*T);
  const M=n360(357.52911+35999.05029*T-0.0001537*T*T);
  const Mr=toR(M);
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)
         +(0.019993-0.000101*T)*Math.sin(2*Mr)
         +0.000289*Math.sin(3*Mr);
  const O=n360(L0+C);                    // true longitude
  const om=n360(125.04-1934.136*T);
  // apparent = true - 0.00569° aberration - 0.00478°·sin(Ω) (longitude nutation included)
  return n360(O - 0.00569 - 0.00478*Math.sin(toR(om)));
}

// ═══════════════════════════════════════════════════════════════════
// MOON apparent ecliptic longitude — Meeus Ch.47, expanded
// ~60 leading periodic terms, accuracy ~0.01° (better than the 0.1°
// of the original 30-term truncation; matters at sub-lord boundaries).
// ═══════════════════════════════════════════════════════════════════
function moonLon(J){
  const T=(J-2451545)/36525;
  const Lp=n360(218.3164477+481267.88123421*T-0.0015786*T*T+T*T*T/538841-T*T*T*T/65194000);
  const D =n360(297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868-T*T*T*T/113065000);
  const M =n360(357.5291092+35999.0502909*T-0.0001536*T*T+T*T*T/24490000);
  const Mp=n360(134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699-T*T*T*T/14712000);
  const F =n360(93.2720950+483202.0175233*T-0.0036539*T*T-T*T*T/3526000+T*T*T*T/863310000);
  const E =1-0.002516*T-0.0000074*T*T;
  const Dr=toR(D),Mr=toR(M),Mpr=toR(Mp),Fr=toR(F);
  // Σl table (subset of 60 strongest terms in 0.000001° units, Meeus Table 47.A)
  // Each row: [coef, D, M, M', F]
  const T47 = [
    [6288774, 0, 0, 1, 0], [1274027, 2, 0,-1, 0], [ 658314, 2, 0, 0, 0],
    [ 213618, 0, 0, 2, 0], [-185116, 0, 1, 0, 0], [-114332, 0, 0, 0, 2],
    [  58793, 2, 0,-2, 0], [  57066, 2,-1,-1, 0], [  53322, 2, 0, 1, 0],
    [  45758, 2,-1, 0, 0], [ -40923, 0, 1,-1, 0], [ -34720, 1, 0, 0, 0],
    [ -30383, 0, 1, 1, 0], [  15327, 2, 0, 0,-2], [ -12528, 0, 0, 1, 2],
    [  10980, 0, 0, 1,-2], [  10675, 4, 0,-1, 0], [  10034, 0, 0, 3, 0],
    [   8548, 4, 0,-2, 0], [  -7888, 2, 1,-1, 0], [  -6766, 2, 1, 0, 0],
    [  -5163, 1, 0,-1, 0], [   4987, 1, 1, 0, 0], [   4036, 2,-1, 1, 0],
    [   3994, 2, 0, 2, 0], [   3861, 4, 0, 0, 0], [   3665, 2, 0,-3, 0],
    [  -2689, 0, 1,-2, 0], [  -2602, 2, 0,-1, 2], [   2390, 2,-1,-2, 0],
    [  -2348, 1, 0, 1, 0], [   2236, 2,-2, 0, 0], [  -2120, 0, 1, 2, 0],
    [  -2069, 0, 2, 0, 0], [   2048, 2,-2,-1, 0], [  -1773, 2, 0, 1,-2],
    [  -1595, 2, 0, 0, 2], [   1215, 4,-1,-1, 0], [  -1110, 0, 0, 2, 2],
    [   -892, 3, 0,-1, 0], [   -810, 2, 1, 1, 0], [    759, 4,-1,-2, 0],
    [   -713, 0, 2,-1, 0], [   -700, 2, 2,-1, 0], [    691, 2, 1,-2, 0],
    [    596, 2,-1, 0,-2], [    549, 4, 0, 1, 0], [    537, 0, 0, 4, 0],
    [    520, 4,-1, 0, 0], [   -487, 1, 0,-2, 0], [   -399, 2, 1, 0,-2],
    [   -381, 0, 0, 2,-2], [    351, 1, 1, 1, 0], [   -340, 3, 0,-2, 0],
    [    330, 4, 0,-3, 0], [    327, 2,-1, 2, 0], [   -323, 0, 2, 1, 0],
    [    299, 1, 1,-1, 0], [    294, 2, 0, 3, 0]
  ];
  let dL=0;
  for(const [c,d,m,mp,f] of T47){
    const Eb = (Math.abs(m)===1)?E : (Math.abs(m)===2)?E*E : 1;
    dL += c*Eb*Math.sin(d*Dr + m*Mr + mp*Mpr + f*Fr);
  }
  // Additional perturbation A1 (Venus), A2 (Jupiter), L'
  const A1=toR(n360(119.75+131.849*T));
  const A2=toR(n360(53.09+479264.290*T));
  dL += 3958*Math.sin(A1) + 1962*Math.sin(toR(Lp)-Fr) + 318*Math.sin(A2);
  return n360(Lp + dL/1e6);
}

// ═══════════════════════════════════════════════════════════════════
// PLANETARY LONGITUDES (Keplerian heliocentric → geocentric)
// Accuracy ~0.5° — adequate for KP house/sub of slow-moving planets.
// (For arc-minute precision on Mercury/Venus, swap in Swiss Ephemeris
// or full VSOP87 — beyond scope of single-file build.)
// ═══════════════════════════════════════════════════════════════════
const ELS={
  Mercury:{a:.38709927,e:.20563593,i:7.00497902,O:48.33076593,w:77.45779628,L0:252.25032350,Lr:149472.67411175},
  Venus:  {a:.72333566,e:.00677672,i:3.39467605,O:76.67984255,w:131.60246718,L0:181.97909950,Lr:58517.81538729},
  Mars:   {a:1.52371034,e:.09339410,i:1.84969142,O:49.55953891,w:-23.94362959,L0:-4.55343205,Lr:19140.30268499},
  Jupiter:{a:5.20288700,e:.04838624,i:1.30439695,O:100.47390909,w:14.72847983,L0:34.39644051,Lr:3034.74612775},
  Saturn: {a:9.53667594,e:.05386179,i:2.48599187,O:113.66242448,w:92.59887831,L0:49.95424423,Lr:1222.49362201}
};

function planetGeo(J,body){
  const T=(J-2451545)/36525;
  const el=ELS[body];if(!el)return 0;
  const L=n360(el.L0+el.Lr*T);
  const M=n360(L-el.w),Mr=toR(M);
  let E=Mr+el.e*Math.sin(Mr)*(1+el.e*Math.cos(Mr));
  for(let k=0;k<8;k++) E=E - (E-el.e*Math.sin(E)-Mr)/(1-el.e*Math.cos(E));
  const xv=el.a*(Math.cos(E)-el.e);
  const yv=el.a*Math.sqrt(1-el.e*el.e)*Math.sin(E);
  const v=toD(Math.atan2(yv,xv));
  const r=Math.sqrt(xv*xv+yv*yv);
  const lonH=n360(v+el.w);
  const Or=toR(el.O),ir=toR(el.i),lhr=toR(lonH);
  const xH=r*(Math.cos(Or)*Math.cos(lhr-Or)-Math.sin(Or)*Math.sin(lhr-Or)*Math.cos(ir));
  const yH=r*(Math.sin(Or)*Math.cos(lhr-Or)+Math.cos(Or)*Math.sin(lhr-Or)*Math.cos(ir));
  const sl=sunLon(J);
  const Re=1.0;
  const xs=Re*Math.cos(toR(sl));
  const ys=Re*Math.sin(toR(sl));
  return n360(toD(Math.atan2(yH+ys, xH+xs)));
}

// ═══════════════════════════════════════════════════════════════════
// RAHU/KETU — Mean lunar ascending node (Meeus 47.6).
// This is the CLASSICAL KP convention used in KSK's original tables
// and the Lahiri Ephemeris. Some modern apps (e.g. JagannathaHora,
// "KP Details" by certain publishers) display the TRUE node instead,
// which oscillates around the mean by up to ±1°40' (~100' at most).
// On May 6 2026 the true−mean offset is ~31'; on other dates it can
// flip sign. If your reference shows a different node value, that's
// the convention difference, not a calculation error.
// ═══════════════════════════════════════════════════════════════════
function rahuLon(J){
  const T=(J-2451545)/36525;
  const om = 125.0445479 - 1934.1362891*T + 0.0020754*T*T
           + T*T*T/467441 - T*T*T*T/60616000;
  return n360(om);
}

// ═══════════════════════════════════════════════════════════════════
// ASCENDANT — Meeus 13.6 with QUADRANT FIX (was 180° off in v1)
// ═══════════════════════════════════════════════════════════════════
function computeAsc(J){
  const T=(J-2451545)/36525;
  // Apparent sidereal time at Greenwich (includes nutation)
  const GMST=n360(280.46061837+360.98564736629*(J-2451545)
                  +0.000387933*T*T-T*T*T/38710000);
  const eps=trueObliquity(J);
  const dpsi=nutation(J);
  // Equation of equinoxes (in degrees): Δψ·cos(ε)
  const eqEq = dpsi*Math.cos(toR(eps));
  const GAST = n360(GMST + eqEq);
  const LST  = n360(GAST + LON);
  const epsr=toR(eps), latr=toR(LAT), lstr=toR(LST);
  // Meeus 13.6 ascendant formula
  const y = -Math.cos(lstr);
  const x =  Math.sin(lstr)*Math.cos(epsr) + Math.tan(latr)*Math.sin(epsr);
  let asc = n360(toD(Math.atan2(y,x)));
  // ── QUADRANT CORRECTION (THE BUG FIX) ──
  // Meeus's atan2 form yields the descendant in the LST ranges where
  // the eastern semi-arc wraps. Force the ascendant to lie east of MC.
  const mc = n360(toD(Math.atan2(Math.sin(lstr), Math.cos(lstr)*Math.cos(epsr))));
  if (n360(asc - mc) > 180) asc = n360(asc + 180);
  return { asc, mc, lst:LST };
}

// ═══════════════════════════════════════════════════════════════════
// SUNRISE / SUNSET (Mumbai) — verified accurate to ~30s
// ═══════════════════════════════════════════════════════════════════
function sunriseSunset(dateStr){
  const dp=dateStr.split('-').map(Number);
  const[yr,mo,dy]=dp;
  let Y=yr,M=mo;
  if(M<=2){Y--;M+=12;}
  const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const JDnoon=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+dy+0.5+B-1524.5;
  const n=JDnoon-2451545.0;
  const L=((280.460+0.9856474*n)%360+360)%360;
  const g=((357.528+0.9856003*n)%360+360)%360;
  const gr=g*DEG;
  const lam=(L+1.915*Math.sin(gr)+0.020*Math.sin(2*gr))*DEG;
  const eps=(23.439-0.0000004*n)*DEG;
  const RA=((Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)))/DEG+360)%360;
  const decl=Math.asin(Math.sin(eps)*Math.sin(lam));
  let EoT=(L-RA)*4;
  if(EoT>20)EoT-=1440;
  if(EoT<-20)EoT+=1440;
  const cosH=(Math.sin(-0.8333*DEG)-Math.sin(LAT*DEG)*Math.sin(decl))
            /(Math.cos(LAT*DEG)*Math.cos(decl));
  if(Math.abs(cosH)>1)return{rise:6*60,set:18*60,hl:60};
  const H=Math.acos(cosH)/DEG;
  const noonIST=(12-EoT/60-LON/15)+locOffset(dateStr,12);
  const riseH=noonIST-H/15;
  const setH =noonIST+H/15;
  return{rise:riseH*60,set:setH*60,hl:(setH-riseH)*60/12};
}

// ═══════════════════════════════════════════════════════════════════
// KP NAKSHATRA / SUB / SUB-SUB
// ═══════════════════════════════════════════════════════════════════
function getNak(lon){
  const l=n360(lon);
  const idx=Math.min(Math.floor(l/NAK_SPAN),26);
  const posInNak=l-idx*NAK_SPAN;
  const pada=Math.min(Math.floor(posInNak/(NAK_SPAN/4))+1,4);
  return{...NAKS[idx],idx,pada,pos:posInNak};
}
function getSub(lon){
  const l=n360(lon);
  const ni=Math.min(Math.floor(l/NAK_SPAN),26);
  const nakL=NAKS[ni].l;
  const posInNak=(l-ni*NAK_SPAN)/NAK_SPAN;
  const si=DO_SEQ.indexOf(nakL);
  let cum=0,sub=nakL,subi=si,ss=nakL;
  for(let i=0;i<9;i++){
    const p=DO_SEQ[(si+i)%9];
    const f=DY[p]/120;
    if(posInNak>=cum&&posInNak<cum+f){
      sub=p;subi=(si+i)%9;
      const posInSub=(posInNak-cum)/f;
      let c2=0;
      for(let j=0;j<9;j++){
        const p2=DO_SEQ[(subi+j)%9];
        const f2=DY[p2]/120;
        if(posInSub>=c2&&posInSub<c2+f2){ss=p2;break;}
        c2+=f2;
      }
      break;
    }
    cum+=f;
  }
  const nk=getNak(lon);
  return{nak:nk.n,nakL:nk.l,sub,ss,pada:nk.pada};
}
function getSign(lon){
  const l=n360(lon);const s=Math.floor(l/30);
  return{sign:SIGNS[s],s,lord:SLRD[s],deg:l%30,abb:SABB[s]};
}
function getD9(lon){
  const l=n360(lon);const s=Math.floor(l/30);const d=l%30;
  const p=Math.floor(d/(30/9));
  const st=[0,9,6,3,0,9,6,3,0,9,6,3];
  return(st[s]+p)%12;
}
// राशि (whole-sign) भाव — उत्तर भारतीय लग्न-कुण्डली: भाव = ग्रह-राशि − लग्न-राशि ।
// (पूर्व में equal-house from ascendant degree था → लग्न-अंश 22° से पहले बैठे ग्रह एक
//  भाव पीछे दिखते थे, e.g. गुरु कर्क→मिथुन; अब राशि व भाव परस्पर संगत हैं ।)
function houseOf(pLon,ascLon){return(((Math.floor(n360(pLon)/30)-Math.floor(n360(ascLon)/30))%12)+12)%12+1;}

// sidereal lon → {i28, pada(1-4), f: fraction within pada slot}
function lonTo28(lon){
  const l=n360(lon);
  if(l>=ABHI_START&&l<ABHI_END){
    const f=(l-ABHI_START)/(ABHI_END-ABHI_START)*4;
    return{i28:21,pada:Math.min(Math.floor(f)+1,4),f:f%1};
  }
  const i27=Math.min(Math.floor(l/NAK_SPAN),26);
  const p=(l-i27*NAK_SPAN)/(NAK_SPAN/4);
  const i28=i27<=20?i27:i27+1;
  return{i28,pada:Math.min(Math.floor(p)+1,4),f:p%1};
}

const VR_ENEMIES={Sun:['Venus','Saturn'],Moon:[],Mars:['Mercury'],Mercury:['Moon'],Jupiter:['Mercury','Venus'],
 Venus:['Sun','Moon'],Saturn:['Sun','Moon','Mars'],

 Ketu:['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn']};
function vrRelation(a,b){ // relation of planet a towards b
  if(a===b)return'swami';
  if((VR_FRIENDS[a]||[]).includes(b))return'mitra';
  if((VR_ENEMIES[a]||[]).includes(b))return'shatru';
  return'sama';
}
// उच्च/नीच (book L636-643): [sign,deg] परम उच्चांश
const VR_UCCHA={Sun:[0,10],Moon:[1,3],Mars:[9,28],Mercury:[5,15],Jupiter:[3,5],Venus:[11,27],Saturn:[6,20],Rahu:[2,15],Ketu:[8,15]};

// ── बल (book L685-715): क्षेत्रबल + उच्चबल (+वक्र-बोनस) ───────────
function vrBala(name,lon,retro,virgoLordName){
  const sg=Math.floor(n360(lon)/30), deg=n360(lon)%30;
  let lord=SLRD[sg]; if(sg===5&&virgoLordName)lord=virgoLordName; // कन्या: बुध/राहु में बली (L634)
  const rel=vrRelation(name,lord);
  const mult=rel==='swami'?4:rel==='mitra'?3:rel==='sama'?2:1;
  const x=15-Math.abs(deg-15);                       // 0..15, राशि-मध्य में पूर्ण
  const kshetra=mult*x/60;                           // 0..1
  // उच्चबल: परम उच्चांश पर पूर्ण (1), परम नीचांश पर आधा (0.5), बीच में त्रैराशिक (L713-715)
  const u=VR_UCCHA[name];let uccha=0.75;
  if(u){const pt=u[0]*30+u[1];
       let dist=Math.abs(n360(lon)-pt); if(dist>180)dist=360-dist;
       uccha=0.5+0.5*(1-dist/180);}
  return kshetra+uccha+(retro?0.25:0);
}

const VR_MEAN_MOTION={Mars:0.5240,Mercury:0.9856,Jupiter:0.0831,Venus:0.9856,Saturn:0.0334};
function vrMotion(name,speed){
  if(name==='Sun'||name==='Moon')return'मार्गी';
  if(name==='Rahu'||name==='Ketu')return'वक्री';
  if(speed<0)return'वक्री';
  if(speed>VR_MEAN_MOTION[name])return'शीघ्री';
  return'मध्यचारी';
}
function vrVedhaDirs(name,motion){
  if(name==='Sun'||name==='Moon'||name==='Rahu'||name==='Ketu')return['front','left','right'];
  if(motion==='वक्री')return['right'];
  if(motion==='शीघ्री')return['left'];
  return['front'];
}

// ── VEDHA RAY GEOMETRY (sub-unit space: 36×36, 4 sub-units/cell) ───
// Planet sits on the border facing centre. Orientation (verified vs
// SBC.png direction arrows): TOP faces ↓ (right hand→chart-left),
// RIGHT faces ← (right→up), BOTTOM faces ↑ (right→chart-right),
// LEFT faces → (right→down).
function vrAnchor(i28,pada){
  const nk=VR28[i28];
  if(nk.side==='T') return{x:(nk.c-1)*4+(pada-1)+0.5,y:4,side:'T'};
  if(nk.side==='R') return{x:32,y:(nk.r-1)*4+(pada-1)+0.5,side:'R'};
  if(nk.side==='B') return{x:(nk.c-1)*4+(4-pada)+0.5,y:32,side:'B'};
  return{x:4,y:(nk.r-1)*4+(4-pada)+0.5,side:'L'};
}
function vrRayVec(side,dir){
  const V={T:{front:[0,1], left:[1,1],  right:[-1,1]},
           R:{front:[-1,0],left:[-1,1], right:[-1,-1]},
           B:{front:[0,-1],left:[-1,-1],right:[1,-1]},
           L:{front:[1,0], left:[1,-1], right:[1,1]}};
  return V[side][dir];
}
// landing border sub-coord → {i28,pada} or null
function vrBorderHit(x,y){
  let side=null,r,c,k;
  if(y>=31.99){side='B';c=Math.min(Math.max(Math.floor(x/4)+1,1),9);k=Math.floor(x-(c-1)*4);}
  else if(y<=4.01){side='T';c=Math.min(Math.max(Math.floor(x/4)+1,1),9);k=Math.floor(x-(c-1)*4);}
  else if(x<=4.01){side='L';r=Math.min(Math.max(Math.floor(y/4)+1,1),9);k=Math.floor(y-(r-1)*4);}
  else if(x>=31.99){side='R';r=Math.min(Math.max(Math.floor(y/4)+1,1),9);k=Math.floor(y-(r-1)*4);}
  else return null;
  k=Math.min(Math.max(k,0),3);
  for(let i=0;i<28;i++){
    const nk=VR28[i];
    if(nk.side!==side)continue;
    if((side==='T'||side==='B')&&nk.c!==(Math.floor(x/4)+1))continue;
    if((side==='L'||side==='R')&&nk.r!==(Math.floor(y/4)+1))continue;
    let pada;
    if(side==='T')pada=k+1; else if(side==='R')pada=k+1;
    else if(side==='B')pada=4-k; else pada=4-k;
    return{i28:i,pada};
  }
  return null; // corner strip — no nakshatra
}
// Cast one ray → {cells:[(r,c)...inner], land:{i28,pada}|null, pts:[x0,y0,x1,y1]}
function vrCastRay(i28,pada,dir){
  const a=vrAnchor(i28,pada);
  const[dx,dy]=vrRayVec(a.side,dir);
  // distance to each border plane
  let tEnd=Infinity;
  if(dx>0)tEnd=Math.min(tEnd,(32-a.x)/dx); if(dx<0)tEnd=Math.min(tEnd,(4-a.x)/dx);
  if(dy>0)tEnd=Math.min(tEnd,(32-a.y)/dy); if(dy<0)tEnd=Math.min(tEnd,(4-a.y)/dy);
  if(!isFinite(tEnd)||tEnd<=0)return{cells:[],land:null,pts:[a.x,a.y,a.x,a.y]};
  const cells=new Set();
  for(let t=0.02;t<tEnd-0.02;t+=0.2){
    const x=a.x+dx*t,y=a.y+dy*t;
    const r=Math.floor(y/4)+1,c=Math.floor(x/4)+1;
    if(r>=2&&r<=8&&c>=2&&c<=8)cells.add(r+','+c);
  }
  const lx=a.x+dx*tEnd, ly=a.y+dy*tEnd;
  const land=vrBorderHit(lx,ly);
  return{cells:[...cells],land,pts:[a.x,a.y,lx,ly]};
}

// ── दृष्टिपाद (book L748-755) — from vedhaka's sign to target sign ──
function vrDrishtiPada(name,fromSign,toSign,d9Sign){
  if(d9Sign===toSign)return 4;            // अपने नवांश पर सदैव पूर्ण दृष्टि (L765)
  const n=((toSign-fromSign+12)%12)+1;
  if(n===7)return 4;
  if(n===4||n===8)return name==='Mars'?4:3;
  if(n===5||n===9)return name==='Jupiter'?4:2;
  if(n===3||n===10)return name==='Saturn'?4:1;
  return 0;
}

// ── सौम्य / क्रूर — अर्घकाण्ड नियम (SBC Vyapar Ratna पृ.394) ─────────

// "इस अर्घकाण्ड में पापयुक्त बुध तथा क्षीण चन्द्र भी कभी पाप नहीं होते" — अतः चारों
// सौम्य सदैव सौम्य ही रहते हैं (विंशोपक संतुलन हेतु: सौम्य-पूर्ण 20, क्रूर-पूर्ण 20) ।
// चन्द्र का शुक्ल/कृष्ण शुभ-पाप पृथक् 'अर्थ-निरूपण' स्तर पर vrMoonPhase() में देखा जाता है ।
function vrSaumya(name,tithi,d9Sign,allP){
  if(name==='Sun'||name==='Mars'||name==='Saturn'||name==='Rahu'||name==='Ketu')return false;
  return true; // चन्द्र, बुध, गुरु, शुक्र — अर्घकाण्ड में सदैव सौम्य
}

// चन्द्र शुभ/पाप तिथि-वश (Key श्लोक 7): शुक्ल6–कृष्ण10 शुभ; कृष्ण11–शुक्ल5 पाप
function vrMoonPhase(tithi){
  const benefic=(tithi>=6&&tithi<=25);
  return{benefic,label:benefic?'शुभ चन्द्र (शुक्ल ६–कृष्ण १०)':'पाप चन्द्र (कृष्ण ११–शुक्ल ५)'};
}

// चन्द्र शृंगोन्नति — स्वतः गणित (आकाश-ज्यामिति; Key श्लोक 5-7,10-11,20) ।
// वाम शृंग उन्नत → मंदी ; दक्षिण शृंग उन्नत → तेजी ।  सूर्य-चन्द्र की क्रान्ति,
// उज्ज्वल-कोर दिक्कोण (χ) व चन्द्र-नतकोण (q) से उन्नत शृंग की गणना ।
function vrShringonnati(sunLonTrop,moonLonTrop,moonLat,eps,latDeg,lstDeg){
  const D2R=Math.PI/180,R2D=180/Math.PI;
  const sl=sunLonTrop*D2R,ml=moonLonTrop*D2R,bm=(moonLat||0)*D2R,e=eps*D2R,phi=latDeg*D2R;
  const aS=Math.atan2(Math.sin(sl)*Math.cos(e),Math.cos(sl));
  const dS=Math.asin(Math.sin(e)*Math.sin(sl));
  const aM=Math.atan2(Math.sin(ml)*Math.cos(e)-Math.tan(bm)*Math.sin(e),Math.cos(ml));
  const dM=Math.asin(Math.sin(bm)*Math.cos(e)+Math.cos(bm)*Math.sin(e)*Math.sin(ml));
  const da=aS-aM;
  const chi=Math.atan2(Math.cos(dS)*Math.sin(da),Math.sin(dS)*Math.cos(dM)-Math.cos(dS)*Math.sin(dM)*Math.cos(da));
  const H=(lstDeg*D2R)-aM;
  const q=Math.atan2(Math.sin(H),Math.tan(phi)*Math.cos(dM)-Math.sin(dM)*Math.cos(H));
  const psi=chi-q;
  const wrap=a=>{a=((a+Math.PI)%(2*Math.PI));if(a<0)a+=2*Math.PI;return a-Math.PI;};
  const c1=wrap(psi+Math.PI/2),c2=wrap(psi-Math.PI/2);
  const thetaUp=Math.abs(c1)<Math.abs(c2)?c1:c2;
  const strength=Math.abs(Math.cos(thetaUp));
  const elong=Math.acos(Math.max(-1,Math.min(1,Math.cos(sl-ml))));
  const illum=(1-Math.cos(elong))/2;
  const dakshina=thetaUp>0;  // प्रेक्षक-वाम उन्नत ⇒ चन्द्र-दक्षिण शृंग (देव-सम्मुख संवत)
  return{illum,tiltDeg:+(thetaUp*R2D).toFixed(1),strength:+strength.toFixed(3),
    horn:dakshina?'दक्षिण':'वाम',side:dakshina?'right':'left',
    effect:dakshina?1:-1,computed:true};
}

// ग्रह-त्रय अधिपति: देश-त्रय / काल-त्रय / पण्य-त्रय (पृ.380-382)
const VR_TRIADS={
  desha:{region:['Rahu','Saturn','Jupiter'],mandala:['Ketu','Sun','Venus'],sthana:['Moon','Mars','Mercury']},
  kala:{varsha:['Rahu','Ketu','Saturn','Jupiter'],masa:['Mars','Sun','Mercury','Venus'],dina:['Moon']},
  panya:{dhatu:['Saturn','Rahu','Mars'],jiva:['Mercury','Moon','Jupiter'],mula:['Ketu','Venus','Sun']}};
const VR_GENDER={Rahu:'पुं',Ketu:'पुं',Sun:'पुं',Jupiter:'पुं',Mars:'पुं',Venus:'स्त्री',Moon:'स्त्री',Saturn:'नपुं',Mercury:'नपुं'};
function vrPanyaClass(cat){ // वस्तु-स्वभाव → धातु/जीव/मूल
  if(cat.some(c=>['metal','gem'].includes(c)))return'dhatu';
  if(cat.some(c=>['animal'].includes(c)))return'jiva';
  if(cat.some(c=>['grain','herb','spice','sugar','oil','ras','cotton','resin','salt','kirana'].includes(c)))return'mula';
  return'dhatu';}
const VR_PANYA_H={dhatu:'धातु',jiva:'जीव',mula:'मूल'};
function vrTriads(balaOf,panyaCat){
  const S=arr=>arr.reduce((a,b)=>(balaOf[a]||0)>=(balaOf[b]||0)?a:b);
  const pc=vrPanyaClass(panyaCat);
  return{region:S(VR_TRIADS.desha.region),mandala:S(VR_TRIADS.desha.mandala),sthana:S(VR_TRIADS.desha.sthana),
    varsha:S(VR_TRIADS.kala.varsha),masa:S(VR_TRIADS.kala.masa),dina:'Moon',
    panyaClass:pc,panyaClassH:VR_PANYA_H[pc],panya:S(VR_TRIADS.panya[pc])};}

// विंशोपक (20-अंक स्वच्छ गणना; पृ.394-395): 4 सौम्य पूर्ण=5; 5 क्रूर पूर्ण=4;
// × (विद्ध-अंग/5) × (दृष्टि-पाद/4) — सौम्य व क्रूर दोनों की पूर्णता 20 ।
function vrVimshopaka(perPlanet){
  let s=0,k=0;
  for(const q of perPlanet){
    if(!(q.L>0&&q.dp>0))continue;
    const v=(q.saum?5:4)*(q.L/5)*(q.dp/4);
    if(q.saum)s+=v;else k+=v;}
  s=Math.min(s,20);k=Math.min(k,20);
  return{saumya:+s.toFixed(2),krura:+k.toFixed(2),net:+(s-k).toFixed(2)};}

// सम/विषम मूल्य-अवस्था व अवधि-सारिणी (Key श्लोक 17-20)
function vrEvenOdd(price){
  if(price==null||isNaN(price))return null;
  const r=Math.floor(price);
  return{value:r,parity:r%2===0?'सम (even)':'विषम (odd)',even:r%2===0};}
const VR_DURATION_TABLE=[{flip:1,days:1},{flip:2,days:3},{flip:3,days:7},{flip:4,days:15}];

// अर्थ-निरूपण संश्लेषण (Key श्लोक 7-21): वेध-नेट + शृंगोन्नति + संयोग/विभेद पूर्ण/अर्ध
function vrArthaNirupana(baseNet,shring,moonPhase){
  const shEffect=shring?shring.effect*shring.strength*(moonPhase&&!moonPhase.benefic?-1:1):0;
  let agree='—',factor=1;
  if(shring){
    const bd=Math.sign(baseNet),sd=Math.sign(shEffect);
    if(bd===0){agree='वेध-तटस्थ → शृंगोन्नति प्रधान';factor=0.6;}
    else if(sd===bd){agree='संयोग — पूर्ण फल';factor=1;}
    else{agree='विभेद — अर्ध/शून्य फल';factor=0.5;}}
  const finalNet=(baseNet+2*shEffect)*factor;
  const verdict=finalNet>0.4?'TEJI':finalNet<-0.4?'MANDI':'NEUTRAL';
  return{base:+baseNet.toFixed(2),shEffect:+shEffect.toFixed(2),agree,factor,
    finalNet:+finalNet.toFixed(2),verdict};}

// ── MAIN: full vedha analysis for one commodity at given positions ──
// pls: [{name,lon,retro,speed,s(sign),d9Sign}], tithi (1..30)
function vrAnalyse(comKey,pls,tithi){
  const PAN=VR_PANCHAK[comKey]; if(!PAN)return null;
  const shukla=tithi<=15;
  const nine=pls.filter(p=>DAY_LORDS.concat(['Rahu','Ketu']).includes(p.name));
  // ── virgo lord & swami selection (book L634, L649-717) ──
  const balaOf={};
  let virgoLord='Mercury';
  {
    const me=nine.find(p=>p.name==='Mercury'),ra=nine.find(p=>p.name==='Rahu');
    const bm=me?vrBala('Mercury',me.lon,me.retro,null):0, br=ra?vrBala('Rahu',ra.lon,ra.retro,null):0;
    virgoLord=bm>=br?'Mercury':'Rahu';
  }
  nine.forEach(p=>balaOf[p.name]=vrBala(p.name,p.lon,p.retro,virgoLord));
  const pick=names=>names.reduce((a,b)=>(balaOf[a]||0)>=(balaOf[b]||0)?a:b);
  const sthanaSwami=pick(['Moon','Mars','Mercury']);   // स्थान-स्वामी
  const dinaSwami='Moon';                              // दिनाधिपति सदैव चन्द्र (L671)
  const panyaSwami=pick(['Mars','Saturn','Rahu']);     // धातु-अधिपति (L673)
  const swami=pick([sthanaSwami,dinaSwami,panyaSwami]);// सबसे बली (L717)
  // ── per-planet vedha ──
  const perPlanet=[];const rays=[];const hitNakPl=[];
  let teji=0,mandi=0;
  for(const p of nine){
    const pos=lonTo28(p.lon);
    const motion=vrMotion(p.name,p.speed);
    const dirs=vrVedhaDirs(p.name,motion);
    const hitCells=new Set();let landNaks=[];
    for(const d of dirs){
      const ray=vrCastRay(pos.i28,pos.pada,d);
      ray.cells.forEach(c=>hitCells.add(c));
      if(ray.land)landNaks.push(ray.land);
      rays.push({planet:p.name,dir:d,pts:ray.pts,motion});
    }
    // कोण वेध (पृ.366-368, दामोदर-मत): अन्त्य-पाद(4) मार्गी ग्रह से, आद्य-पाद(1)
    // वक्री ग्रह से कोण-स्वर का वेध; पूर्णा-तिथि का वेध दोनों (मार्गी+वक्री) से ।
    let konas=[];
    const konaMatch=KONA_VEDHA.filter(k=>k.i28===pos.i28&&k.pada===pos.pada);
    if(konaMatch.length){
      const isVakri=motion==='वक्री';
      const vowelOK=(pos.pada===4&&!isVakri)||(pos.pada===1&&isVakri);
      if(vowelOK){konas=konaMatch.map(k=>k.cell);konas.forEach(c=>hitCells.add(c));}
      hitCells.add(TITHI_CELL['पूर्णा']);   // पूर्णा-तिथि — मार्गी व वक्री दोनों से
    }
    // limb hits for this commodity
    const hits={varna:false,svara:false,tithi:false,nak:false,rashi:false};
    if(hitCells.has(PAN.cell))hits.varna=true;
    else{ // अनुक्त वर्ण: any hit letter-cell whose group contains our varna
      for(const cc of hitCells){const cd=SBC_INNER[cc];
        if(cd&&cd.type==='ltr'&&cd.letters.includes(PAN.varna)){hits.varna=true;break;}}
    }
    for(const sc of (SVARA_CELLS[PAN.svara]||[]))if(hitCells.has(sc))hits.svara=true;
    if(hitCells.has(TITHI_CELL[PAN.tithiGrp]))hits.tithi=true;
    if(hitCells.has(RASHI_CELL[PAN.rashi]))hits.rashi=true;
    for(const ln of landNaks){if(ln.i28===PAN.i28){hits.nak=true;hitNakPl.push({planet:p.name,pada:ln.pada});}}
    // तिथि-वेध दृष्टि-विकल्प (L761): राशि पर दृष्टि → तिथि पर भी
    const saum=vrSaumya(p.name,tithi,p.d9Sign,nine);
    const dp=vrDrishtiPada(p.name,p.s,PAN.rashi,p.d9Sign);
    let L=0;
    if(hits.varna)L+=1; if(hits.svara)L+=1; if(hits.nak)L+=1; if(hits.rashi)L+=1;
    if(hits.tithi)L+=shukla?1:0.5;           // कृष्ण पक्ष में तिथि-वेध आधा (L763)
    const rel=vrRelation(p.name,swami);
    const rf=saum?(rel==='swami'?1:rel==='mitra'?0.75:rel==='sama'?0.5:0.25)
                 :(rel==='swami'?0.25:rel==='mitra'?0.5:rel==='sama'?0.75:1);
    const vish=(L>0&&dp>0)?(saum?5:4)*(L/5)*(dp/4)*rf:0;  // दृष्टि न हो तो फल शून्य (L765)
    if(vish>0){ if(saum)mandi+=vish; else teji+=vish; }
    perPlanet.push({name:p.name,i28:pos.i28,pada:pos.pada,motion,dirs,saum,rel,dp,L,vish,hits,konas:konas.length>0});
  }
  const net=teji-mandi;
  const verdict=net>0.4?'TEJI':net<-0.4?'MANDI':'NEUTRAL';
  // nakshatra-table effects: planets sitting on naks whose item-list covers this commodity
  const nakFx=[];
  for(const p of nine){
    const pos=lonTo28(p.lon);const fx=VR_NAK_FX[pos.i28];
    const rel2=fx.cats.some(c=>PAN.cat.includes(c))||fx.cats.includes('all');
    if(rel2){const saum=vrSaumya(p.name,tithi,p.d9Sign,nine);
      nakFx.push({planet:p.name,nak:VR28[pos.i28],fx,saum});}
  }
  const moonPhase=vrMoonPhase(tithi);
  const triads=vrTriads(balaOf,PAN.cat);
  const vimsho=vrVimshopaka(perPlanet);
  return{swami,sthanaSwami,dinaSwami,panyaSwami,virgoLord,balaOf,teji,mandi,net,verdict,perPlanet,rays,nakFx,hitNakPl,tithi,shukla,moonPhase,triads,vimsho};
}

// ── tithi from sun/moon lons ───────────────────────────────────────

const DHRU_TITHI=[18,20,22,24,26,25,23,29,16,17,15,13,11,6,16,7]; // प्रतिपदा..चतुर्दशी, पूर्णिमा, अमावास्या

const DHRU_TEJI={Sun:1,Mars:1,Rahu:1,Saturn:1,Ketu:1};
function vrDhruvank(comKey,D){

  const masIdx=(sunS+1)%12; // मीन-सूर्य≈चैत्र … (अमान्त सन्निकटन)
  const city=DHRU_CITY[LOC.k]||DHRU_CITY.MUMBAI;
  const wd=new Date(D.dateStr+'T12:00:00').getDay();
  const parts=[['वस्तु '+dc[0],dc[1]],['नक्षत्र '+NAKS[moonNk].n,DHRU_NAK[moonNk]],['तिथि '+t,DHRU_TITHI[ti]],
               ['संक्रान्ति '+SIGNS[sunS],DHRU_SANK[sunS]],['वार',DHRU_VAR[wd]],['मास',DHRU_MAS[masIdx]],[city[0],city[1]]];
  const sum=parts.reduce((a,b)=>a+b[1],0);
  let rem=sum%9; if(rem===0)rem=9;
  const startIdx=DHRU_SEQ.indexOf(DAY_LORDS[wd]);
  const planet=DHRU_SEQ[(startIdx+rem-1)%9];
  const verdict=planet==='Mercury'?'सम':DHRU_TEJI[planet]?'तेजी':'मंदी';
  return{parts,sum,rem,planet,verdict};
}

const MUH15=[1,5,8,14,17,23], MUH45=[3,6,11,15,20,25]; // 27-idx
function vrSankranti(D,ayMode){
  const dp=D.dateStr.split('-').map(Number);
  const sunS=D.planets.find(p=>p.name==='Sun').s;
  let back=0,entryJD=null;
  for(let d=1;d<=33;d++){
    const Jx=JD(dp[0],dp[1],dp[2],12)-d;
    const sl=n360(geoLon('Sun',Jx)-getAyanamsa(Jx,ayMode));
    if(Math.floor(sl/30)!==sunS){back=d-1;entryJD=Jx+1;break;}
  }
  if(entryJD===null)return null;
  const wdToday=new Date(D.dateStr+'T12:00:00').getDay();
  const wdEntry=((wdToday-back)%7+7)%7;
  const moonNk=getNak(n360(geoLon('Moon',entryJD)-getAyanamsa(entryJD,ayMode))).idx;
  const muh=MUH15.includes(moonNk)?15:MUH45.includes(moonNk)?45:30;

  return{sign:sunS,wdEntry,daysAgo:back,moonNk,muh,fx};

// ── 15-MIN HEATMAP (96 slots × full vedha scoring) ─────────────────
const VR_HEAT_CACHE={};
function vrHeatmap(dateStr,comKey,ayMode){
  const key=dateStr+'|'+comKey+'|'+ayMode+'|'+LOC.k;
  if(VR_HEAT_CACHE[key])return VR_HEAT_CACHE[key];
  const dp=dateStr.split('-').map(Number);
  const names=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn','Rahu'];
  const lon0={},lon1={};
  const J0=JD(dp[0],dp[1],dp[2],0),J1=JD(dp[0],dp[1],dp[2],24);
  for(const n of names){lon0[n]=n==='Rahu'?rahuLon(J0):geoLon(n,J0);lon1[n]=n==='Rahu'?rahuLon(J1):geoLon(n,J1);}
  // speeds & motion at midday
  const Jm=JD(dp[0],dp[1],dp[2],12);
  const spd={},retroF={};
  for(const n of names){const a=n==='Rahu'?rahuLon(Jm-0.5):geoLon(n,Jm-0.5),b=n==='Rahu'?rahuLon(Jm+0.5):geoLon(n,Jm+0.5);
    let s=((b-a+540)%360)-180;spd[n]=s;retroF[n]=s<0;}
  spd.Ketu=spd.Rahu;retroF.Ketu=true;retroF.Rahu=true;
  const slots=[];
  for(let min=0;min<24*60;min+=15){
    const f=min/(24*60);
    const ay=getAyanamsa(J0+f,ayMode);
    const pls=[];
    let sunL=0,moonL=0;
    for(const n of names){
      let tl;
      if(n==='Moon'||n==='Sun'||n==='Mercury'||n==='Venus'){ // fast bodies: exact
        const Jx=J0+f*(J1-J0);tl=n==='Rahu'?rahuLon(Jx):geoLon(n,Jx);
      }else{ // slow: linear interp across the day
        let d=((lon1[n]-lon0[n]+540)%360)-180;tl=n360(lon0[n]+d*f);
      }
      if(n==='Sun')sunL=tl; if(n==='Moon')moonL=tl;
      const sl=n360(tl-ay);
      pls.push({name:n,lon:sl,retro:retroF[n],speed:spd[n],s:Math.floor(sl/30),d9Sign:getD9(sl)});
    }
    const ke=n360(pls.find(p=>p.name==='Rahu').lon+180);
    pls.push({name:'Ketu',lon:ke,retro:true,speed:spd.Ketu,s:Math.floor(ke/30),d9Sign:getD9(ke)});
    const tithi=vrTithi(n360(sunL),n360(moonL));
    const an=vrAnalyse(comKey,pls,tithi);
    const top=an.perPlanet.filter(q=>q.vish>0).sort((a,b)=>b.vish-a.vish)[0];
    slots.push({min,net:an.net,teji:an.teji,mandi:an.mandi,tithi,
                top:top?`${top.name} ${top.saum?'सौम्य':'क्रूर'} वेध`:'—'});
  }
  VR_HEAT_CACHE[key]=slots;
  return slots;
}

// GANN SQUARE-OF-9
// ═══════════════════════════════════════════════════════════════════
// GANN SQUARE-OF-9 LEVELS
// ───────────────────────────────────────────────────────────────────
// Generates support/resistance levels around an ANCHOR price using
// the classical SQ9 formula: level = (√anchor + n)² where n is in
// units of 0.5 (each 0.5 unit corresponds to ~22.5° on the SQ9 wheel).
// The anchor should be a FIXED reference for the trading session —
// typically the Day Open or Previous Close, NOT live price.
// ═══════════════════════════════════════════════════════════════════
function gannLevels(anchor){
  const sq=Math.sqrt(Math.max(anchor,1));
  return[-2,-1.5,-1,-0.5,0,.5,1,1.5,2].map(u=>{
    const p=Math.round((sq+u)**2);
    const pct=((p-anchor)/anchor*100).toFixed(2);
    const type=u===0?'BASE':u>0?`R${Math.abs(u)*2}`:`S${Math.abs(u)*2}`;
    return{u,p,pct,type};
  });
}

// BIAS ENGINE (unchanged; weights configurable)
// ═══════════════════════════════════════════════════════════════════
function computeBias(planets){
  const pm=Object.fromEntries(planets.map(p=>[p.name,p]));
  const F=[];let sc=0;
  const add=(l,w,d)=>{F.push({l,w,d});sc+=w*d;};
  const{Sun,Moon,Mars,Mercury,Jupiter,Venus,Saturn,Rahu,Ketu}=pm;
  if(Sun){
    if(Sun.h===11)add('Sun in 11H — profit house',25,1);
    if(Sun.h===5)add('Sun in 5H speculation',12,1);
    if(Sun.s===0)add('Sun exalted Aries',20,1);
    else if(Sun.s===6)add('Sun debilitated Libra',20,-1);
    if([6,8,12].includes(Sun.h))add('Sun in dusthana H'+Sun.h,15,-1);
  }
  if(Moon){
    if([1,4,5,7,10,11].includes(Moon.h)&&![6,8,12].includes(Moon.h))add('Moon in good house H'+Moon.h,14,1);
    if([6,8,12].includes(Moon.h))add('Moon in dusthana H'+Moon.h,12,-1);
    if(Moon.s===1)add('Moon exalted Taurus',12,1);
    if(Moon.s===7)add('Moon debilitated Scorpio',12,-1);
  }
  if(Jupiter){
    if(Jupiter.h===1)add('Jupiter in Lagna — expansive',20,1);
    else if(Jupiter.h===11)add('Jupiter in 11H gains',15,1);
    else if(Jupiter.h===5)add('Jupiter in 5H trikona',10,1);
    if([6,8,12].includes(Jupiter.h))add('Jupiter in dusthana',10,-1);
    if(Jupiter.s===3)add('Jupiter exalted Cancer',15,1);
    if(Jupiter.s===9)add('Jupiter debilitated Capricorn',15,-1);
  }
  if(Mars&&Saturn){
    const df=n360(Mars.lon-Saturn.lon),d=df>180?360-df:df;
    if(d<8)add(`Mars-Sat conj ${dmsC(d)} (tight)`,18,-1);
    else if(d<18)add(`Mars-Sat near conj ${Math.round(d)}°`,8,-1);
  }
  if(Mercury){
    if(Mercury.s===11)add('Mercury debilitated Pisces',10,-1);
    if(Mercury.s===5)add('Mercury exalted Virgo',10,1);
    if([6,8,12].includes(Mercury.h))add('Mercury in dusthana H'+Mercury.h,7,-1);
  }
  if(Venus){
    if(Venus.h===12)add('Venus in 12H — expenses',8,-1);
    if([1,6].includes(Venus.s))add('Venus own sign',8,1);
    if(Venus.s===11)add('Venus exalted Pisces',12,1);
    if(Venus.s===5)add('Venus debilitated Virgo',12,-1);
  }
  if(Rahu&&[5,11].includes(Rahu.h))add('Rahu in 5/11H gains',8,1);
  const norm=Math.max(-100,Math.min(100,sc*0.8));
  const bias=norm>15?'BULLISH':norm<-15?'BEARISH':'NEUTRAL';
  return{score:Math.round(norm),bias,F:F.slice(0,10)};
}

function hourBias(planet,planets){
  const p=planets.find(x=>x.name===planet);
  if(!p)return{bias:'NEUTRAL',col:'var(--neut)',arrow:'→',ind:'Sideways'};
  if(planet==='Saturn')return{bias:'VOLATILE',col:'var(--neut)',arrow:'↕',ind:'Reversal zone — caution'};
  if(planet==='Ketu')return{bias:'BEARISH',col:'var(--bear)',arrow:'▼',ind:'Sudden dip risk'};
  if(planet==='Rahu')return{bias:'VOLATILE',col:'var(--neut)',arrow:'↕',ind:'Choppy/whipsaw'};
  if([1,5,9,11].includes(p.h)&&![6,7,8].includes(p.s))return{bias:'BULLISH',col:'var(--bull)',arrow:'▲',ind:'Bull momentum hour'};
  if([6,8,12].includes(p.h)||[6,8].includes(p.s))return{bias:'BEARISH',col:'var(--bear)',arrow:'▼',ind:'Bear contraction hour'};
  if(planet==='Jupiter'&&[1,4,5,9].includes(p.h))return{bias:'BULLISH',col:'var(--bull)',arrow:'▲▲',ind:'Strong bull push'};
  if(planet==='Sun'&&p.h===11)return{bias:'BULLISH',col:'var(--bull)',arrow:'▲',ind:'Profit hour — exalted'};
  return{bias:'NEUTRAL',col:'var(--neut)',arrow:'→',ind:'Range-bound / wait'};
}

// EPHEMERIS WRAPPER — uses Astronomy Engine (VSOP87/ELP) when loaded,
// falls back to in-file Keplerian/Sun/Moon series when offline.
// AE delivers sub-arcsecond accuracy matching JPL Horizons.
// ═══════════════════════════════════════════════════════════════════
function jdToDate(J){
  // JD → JS Date (UTC). JD 2440587.5 = 1970-01-01 00:00 UT
  return new Date((J-2440587.5)*86400000);
}
function isAELoaded(){
  return typeof window!=='undefined' && typeof window.Astronomy!=='undefined'
      && typeof window.Astronomy.GeoVector==='function';
}
function ephemerisStatus(){
  return isAELoaded() ? 'VSOP87/ELP (sub-arcsecond)' : 'Keplerian fallback (~5\' accuracy)';
}

// Geocentric apparent ecliptic longitude (tropical, ecliptic of date)
function geoLon(body,J){
  if(isAELoaded()){
    try{
      const A=window.Astronomy, d=jdToDate(J);
      if(body==='Moon') return n360(A.EclipticGeoMoon(d).lon);
      if(body==='Sun'){
        const ev=A.HelioVector(A.Body.Earth,d);
        return n360(A.Ecliptic({x:-ev.x,y:-ev.y,z:-ev.z,t:ev.t}).elon);
      }
      const v=A.GeoVector(A.Body[body],d,true); // aberration=true → apparent
      return n360(A.Ecliptic(v).elon);
    }catch(e){ /* fall through to Keplerian */ }
  }
  if(body==='Sun')  return sunLon(J);
  if(body==='Moon') return moonLon(J);
  return planetGeo(J,body);
}

// Retrograde detection: compare longitude at J-12h vs J+12h
function isRetrograde(body,J){
  if(body==='Sun'||body==='Moon') return false;
  if(body==='Rahu'||body==='Ketu') return true; // mean nodes always retrograde
  try{
    let l1=geoLon(body,J-0.5), l2=geoLon(body,J+0.5);
    let d=l2-l1; if(d>180)d-=360; if(d<-180)d+=360;
    return d<0;
  }catch(e){ return false; }
}
function computeAll(dateStr,timeIST,ayMode){
  const dp=dateStr.split('-').map(Number);
  const J=JD(dp[0],dp[1],dp[2],timeIST);
  const ay=getAyanamsa(J,ayMode);

  const trop={
    Sun:    geoLon('Sun',J),
    Moon:   geoLon('Moon',J),
    Mars:   geoLon('Mars',J),
    Mercury:geoLon('Mercury',J),
    Jupiter:geoLon('Jupiter',J),
    Venus:  geoLon('Venus',J),
    Saturn: geoLon('Saturn',J),
    Rahu:   rahuLon(J),
    Uranus: geoLon('Uranus',J),
    Neptune:geoLon('Neptune',J)
  };
  trop.Ketu=n360(trop.Rahu+180);

  // Retrograde flags (Rahu/Ketu always retrograde by convention; Sun/Moon never)
  const retro={
    Sun:false, Moon:false,
    Mars:    isRetrograde('Mars',J),
    Mercury: isRetrograde('Mercury',J),
    Jupiter: isRetrograde('Jupiter',J),
    Venus:   isRetrograde('Venus',J),
    Saturn:  isRetrograde('Saturn',J),
    Uranus:  isRetrograde('Uranus',J),
    Neptune: isRetrograde('Neptune',J),
    Rahu:true, Ketu:true
  };

  const ascObj=computeAsc(J);
  const ascTrop=ascObj.asc;
  const ascSid=n360(ascTrop-ay);
  const ascSign=getSign(ascSid);
  const ascSub=getSub(ascSid);
  const ascNak=getNak(ascSid);
  const mcSid=n360(ascObj.mc-ay);

  // Daily motion (deg/day) per body — central difference; drives the
  // book's वक्री/शीघ्री/मध्यचारी vedha-direction logic.
  const speedOf={};
  for(const nm of Object.keys(trop)){
    const a=nm==='Rahu'?rahuLon(J-0.5):nm==='Ketu'?n360(rahuLon(J-0.5)+180):geoLon(nm,J-0.5);
    const b=nm==='Rahu'?rahuLon(J+0.5):nm==='Ketu'?n360(rahuLon(J+0.5)+180):geoLon(nm,J+0.5);
    speedOf[nm]=((b-a+540)%360)-180;
  }

  const planets=Object.entries(trop).map(([name,tl])=>{
    const sl=n360(tl-ay);
    const sg=getSign(sl);
    const nk=getNak(sl);
    const sb=getSub(sl);
    const h=houseOf(sl,ascSid);
    const d9s=getD9(sl);
    return{name,tLon:tl,lon:sl,s:sg.s,sign:sg.sign,abb:sg.abb,lord:sg.lord,deg:sg.deg,
      h,nak:nk.n,nakL:nk.l,sub:sb.sub,ss:sb.ss,pada:nk.pada,d9Sign:d9s,
      retro:retro[name]||false,
      speed:speedOf[name]||0,
      motion:vrMotion(name,speedOf[name]||0),
      abbr:PA[name]||name.slice(0,2)};
  });

  const dayOfWeek=new Date(dateStr).getDay();
  const dayLord=DAY_LORDS[dayOfWeek];
  const moon=planets.find(p=>p.name==='Moon');
  const rp=[dayLord,moon?.nakL,moon?.sub,ascSub.nakL,ascSub.sub].filter(Boolean);

  const{rise:rMin,set:sMin,hl:hlMin}=sunriseSunset(dateStr);
  const chaldStart=CHALD.indexOf(dayLord);

  // PLANETARY HOURS — full 24h cycle (12 day + 12 night hours)
  // Day hour length = (sunset - sunrise)/12  (~hlMin from sunriseSunset)
  // Night hour length = (24h - daylight)/12
  const phpHours=[];
  const dayHL  = hlMin;
  const nightHL= (24*60 - (sMin - rMin))/12;
  for(let i=0;i<24;i++){
    const isDay = i<12;
    const len = isDay ? dayHL : nightHL;
    const start = isDay ? rMin + i*dayHL : sMin + (i-12)*nightHL;
    phpHours.push({planet:CHALD[(chaldStart+i)%7], sm:start, em:start+len, isDay});
  }

  const slots=[];
  // 5-MIN GRID across 24h: 00:00 → 23:55 = 288 slots
  // Marks mcx=true/false based on MCX trading window (09:00–23:30 IST)
  for(let min=0;min<24*60;min+=5){
    const slotIST = min/60;
    const Jslot = JD(dp[0],dp[1],dp[2],slotIST);
    const aySlot = getAyanamsa(Jslot,ayMode);
    const ml = n360(geoLon('Moon',Jslot) - aySlot);
    const msg=getSign(ml);const mnk=getNak(ml);const msb=getSub(ml);
    const ph=phpHours.find(h=>min>=h.sm&&min<h.em)||phpHours[phpHours.length-1]||{planet:dayLord};
    const phPlanet=ph?.planet||dayLord;
    const hb=hourBias(phPlanet,planets);

      moonSign:msg.sign,moonDeg:msg.deg,moonNak:mnk.n,moonNakL:msb.nakL,
      moonSub:msb.sub,moonSS:msb.ss,moonPada:mnk.pada,
      moonLon:ml, mcx:isMcxWindow(min)});
  }

  const bias=computeBias(planets);

  // ── व्यापार रत्न SBC vedha analysis (focus commodity) ──
  const sunP=planets.find(p=>p.name==='Sun');
  const tithi=vrTithi(sunP.lon,moon.lon);
  let vr=null;
  try{vr=vrAnalyse(S.selectedCom,planets,tithi);}
  catch(e){console.error('VR analyse:',e);}
  // ── चन्द्र शृंगोन्नति (स्वतः) + अर्थ-निरूपण संश्लेषण ──
  if(vr){try{
    const epsS=trueObliquity(J), nodeT=rahuLon(J), mlT=moonLon(J);
    const mLat=5.13*Math.sin(toR(n360(mlT-nodeT)));   // सन्निकट चन्द्र-शर
    const lstD=computeAsc(J).lst;
    vr.shring=vrShringonnati(sunLon(J),mlT,mLat,epsS,LAT,lstD);
    vr.artha=vrArthaNirupana(vr.net,vr.shring,vr.moonPhase);
  }catch(e){console.error('VR shring/artha:',e);}}

  return{J,ay,ayMode,ascSid,ascSign,ascSub,ascNak,mcSid,planets,dayLord,moon,rp,
    rMin,sMin,hlMin,phpHours,slots,bias,dateStr,timeIST,tithi,vr,
    ephSrc:ephemerisStatus()};
}

function mtt(m){let h=Math.floor(m/60),mn=Math.floor(m%60);return`${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;}
function pc(p){return PC[p]||'#7ecad8';}

// ── DMS FORMATTING (degree · minute · second) ──────────────────────
// secDec=0 → DD°MM'SS"      e.g. 5°40'53"
// secDec=2 → DD°MM'SS.ss"   e.g. 24°08'09.03"   (used for ayanamsa)
function dms(deg, secDec){
  if(secDec===undefined) secDec=0;
  if(deg===null||deg===undefined||isNaN(deg)) return '—';
  const sign = deg<0 ? '-' : '';
  const a = Math.abs(deg);
  let d = Math.floor(a);
  const minF = (a-d)*60;
  let m = Math.floor(minF);
  let s = (minF-m)*60;
  // Round seconds and carry over
  const f = Math.pow(10,secDec);
  s = Math.round(s*f)/f;
  if(s>=60){s-=60; m+=1;}
  if(m>=60){m-=60; d+=1;}
  const sStr = secDec>0
    ? s.toFixed(secDec).padStart(secDec+3,'0')
    : Math.round(s).toString().padStart(2,'0');
  return `${sign}${d}°${String(m).padStart(2,'0')}'${sStr}"`;
}
// Compact form for tight cells (no zero-pad on degrees)
function dmsC(deg){
  if(deg===null||deg===undefined||isNaN(deg)) return '—';
  const a = Math.abs(deg);
  let d = Math.floor(a);
  const minF = (a-d)*60;
  let m = Math.floor(minF);
  let s = Math.round((minF-m)*60);
  if(s===60){s=0; m+=1;}
  if(m===60){m=0; d+=1;}
  return `${d}°${String(m).padStart(2,'0')}'${String(s).padStart(2,'0')}"`;
}

function commodityBias(commKey, planets, dayLord){
  const com = CBYK[commKey];
  if(!com) return {score:0, bias:'NEUTRAL', factors:[]};
  const pm = Object.fromEntries(planets.map(p=>[p.name,p]));
  const pri = pm[com.pri], sec = pm[com.sec];
  const F = []; let sc = 0;
  const add = (l,w,d) => { F.push({l,w,d}); sc += w*d; };

  // Vyapaar Ratna Vedic Yogas Integration
  if (typeof VEDIC_RULES !== 'undefined') {
    VEDIC_RULES.forEach(r => {
      if (r.targets.includes(commKey)) {
        try {
          if (r.check(planets)) {
            const dir = r.bias === 'BULLISH' ? 1 : r.bias === 'BEARISH' ? -1 : 0;
            const dirText = r.bias === 'BULLISH' ? 'तेजी' : r.bias === 'BEARISH' ? 'मंदी' : 'घटा-बढ़ी';
            add(`[Vedic] ${r.name} (${dirText})`, r.weight, dir);
          }
        } catch (e) {
          console.warn('Vedic check error for ' + r.id + ':', e);
        }
      }
    });
  }

  // PRIMARY significator scoring (heaviest weight)
  if(pri){
    // House placement (KP: 2,5,9,11 = bullish wealth/profit houses; 6,8,12 = bearish)
    if([2,11].includes(pri.h))      add(`${com.pri} in ${pri.h}H wealth/profit house`, 25, 1);
    else if([5,9].includes(pri.h))  add(`${com.pri} in ${pri.h}H trikona`, 18, 1);
    else if([1,4,10].includes(pri.h))add(`${com.pri} in ${pri.h}H kendra`, 10, 1);
    else if(pri.h===6)              add(`${com.pri} in 6H — supply pressure`, 22, -1);
    else if(pri.h===8)              add(`${com.pri} in 8H — sudden shocks`, 20, -1);
    else if(pri.h===12)             add(`${com.pri} in 12H — losses/leakage`, 18, -1);

    // Sign dignity
    if(pri.name==='Sun' && pri.s===0)   add('Sun exalted Aries — Gold strong', 15, 1);
    if(pri.name==='Sun' && pri.s===6)   add('Sun debilitated Libra — Gold weak', 15, -1);
    if(pri.name==='Moon' && pri.s===1)  add('Moon exalted Taurus — Silver strong', 14, 1);
    if(pri.name==='Moon' && pri.s===7)  add('Moon debilitated Scorpio — Silver weak', 14, -1);
    if(pri.name==='Mars' && pri.s===9)  add('Mars exalted Capricorn', 14, 1);
    if(pri.name==='Mars' && pri.s===3)  add('Mars debilitated Cancer', 14, -1);
    if(pri.name==='Saturn' && pri.s===6)add('Saturn exalted Libra', 14, 1);
    if(pri.name==='Saturn' && pri.s===0)add('Saturn debilitated Aries', 14, -1);

    // Retrograde
    if(pri.retro) add(`${com.pri} retrograde — trend pause/reversal`, 12, -1);

    // Sub-lord verdict (KP: sub-lord is the FINAL signifier)
    const subL = pm[pri.sub];
    if(subL){
      if([2,5,9,10,11].includes(subL.h)) add(`Sub-lord ${pri.sub} in ${subL.h}H — bullish signal`, 18, 1);
      else if([6,8,12].includes(subL.h)) add(`Sub-lord ${pri.sub} in ${subL.h}H — bearish signal`, 18, -1);
    }
  }

  // SECONDARY significator (half weight)
  if(sec){
    if([2,11].includes(sec.h))      add(`${com.sec} (co-sig) in ${sec.h}H profit`, 10, 1);
    else if([6,8,12].includes(sec.h))add(`${com.sec} (co-sig) in ${sec.h}H dusthana`, 10, -1);
    if(sec.retro)                   add(`${com.sec} (co-sig) retrograde`, 6, -1);
  }

  // Mars-Saturn conjunction → bearish pressure on base metals & crude
  if(pm.Mars && pm.Saturn && ['COPPER','ZINC','STEEL','NICKEL','LEAD','CRUDEOIL'].includes(commKey)){
    const df = n360(pm.Mars.lon - pm.Saturn.lon);
    const d = df>180 ? 360-df : df;
    if(d<8)       add(`Mars-Saturn tight conj ${dmsC(d)} — base metals bearish`, 15, -1);
    else if(d<18) add(`Mars-Saturn near conj — caution`, 8, -1);
  }

  // Rahu/Ketu in dusthanas hurts crude/natgas
  if(['CRUDEOIL','NATGAS'].includes(commKey)){
    if(pri && [6,8,12].includes(pri.h)) add(`Node in dusthana — energy weak`, 10, -1);
    if(pri && [5,11].includes(pri.h))   add(`Node in 5/11 — speculative surge`, 14, 1);
  }

  // Day-lord boost
  if(dayLord===com.pri) add(`Day-lord is ${dayLord} — own day boost`, 8, 1);
  if(dayLord===com.sec) add(`Day-lord is ${dayLord} — co-sig day`, 5, 1);

  const norm = Math.max(-100, Math.min(100, sc*0.8));
  const bias = norm>15 ? 'BULLISH' : norm<-15 ? 'BEARISH' : 'NEUTRAL';
  return {score:Math.round(norm), bias, F:F.slice(0,12)};
}

  // Houses FIXED in the frame (H1 always the top-centre diamond),
  // signs rotate with the lagna; houses run anticlockwise. Sign is
  // shown as its number (1=मेष Aries … 12=मीन Pisces), the North
  // Indian convention.
  function makeChart(pArr,lagS,title,subtitle){
    const Z=520, pad=8, W=Z+pad*2;
    // house polygons (fractions of Z)
    const PG={
      1:[[.5,0],[.25,.25],[.5,.5],[.75,.25]],
      2:[[0,0],[.5,0],[.25,.25]],
      3:[[0,0],[.25,.25],[0,.5]],
      4:[[0,.5],[.25,.25],[.5,.5],[.25,.75]],
      5:[[0,.5],[.25,.75],[0,1]],
      6:[[0,1],[.25,.75],[.5,1]],
      7:[[.5,1],[.25,.75],[.5,.5],[.75,.75]],
      8:[[.5,1],[.75,.75],[1,1]],
      9:[[1,1],[.75,.75],[1,.5]],
      10:[[1,.5],[.75,.75],[.5,.5],[.75,.25]],
      11:[[1,.5],[.75,.25],[1,0]],
      12:[[1,0],[.75,.25],[.5,0]]
    };
    // sign-number anchor + planet-cluster anchor per house
    const NUM={1:[.5,.40],2:[.25,.175],3:[.155,.25],4:[.42,.5],5:[.155,.75],6:[.25,.845],
               7:[.5,.62],8:[.75,.845],9:[.845,.75],10:[.58,.5],11:[.845,.25],12:[.75,.175]};
    const PL ={1:[.5,.175],2:[.25,.065],3:[.06,.25],4:[.25,.5],5:[.06,.75],6:[.25,.945],
               7:[.5,.83],8:[.75,.945],9:[.94,.75],10:[.75,.5],11:[.94,.25],12:[.75,.065]};
    const X=f=>pad+f*Z, Y=f=>pad+f*Z;
    let s=`<svg width="${W}" height="${W}" xmlns="http://www.w3.org/2000/svg">`;
    s+=`<rect width="${W}" height="${W}" fill="#010c12" rx="4"/>`;
    // house fills (kendra diamonds slightly brighter)
    for(let h=1;h<=12;h++){
      const ang=[1,4,7,10].includes(h);
      s+=`<polygon points="${PG[h].map(([a,b])=>`${X(a)},${Y(b)}`).join(' ')}" fill="${ang?'#021c26':'#010f18'}" stroke="none"/>`;
    }
    // frame: outer square + diagonals + inner diamond (the NI chart lines)
    const ln=(x1,y1,x2,y2)=>`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="#1e6080" stroke-width="1.4"/>`;
    s+=`<rect x="${X(0)}" y="${Y(0)}" width="${Z}" height="${Z}" fill="none" stroke="#1e6080" stroke-width="1.6"/>`;
    s+=ln(0,0,1,1)+ln(1,0,0,1)+ln(.5,0,1,.5)+ln(1,.5,.5,1)+ln(.5,1,0,.5)+ln(0,.5,.5,0);
    // sign numbers + planets
    for(let h=1;h<=12;h++){
      const sIdx=((lagS+h-1)%12+12)%12;
      s+=`<text x="${X(NUM[h][0])}" y="${Y(NUM[h][1])+4}" text-anchor="middle" fill="#46aed4" font-size="18" font-weight="bold" font-family="Courier New">${sIdx+1}</text>`;
      const pH=pArr.filter(p=>(p.h||p.house)===h);
      const n=pH.length;
      pH.forEach((p,i)=>{
        // arrange: 1/row for ≤3 planets, 2/row beyond
        const perRow=n>3?2:1;
        const row=Math.floor(i/perRow), col=i%perRow;
        const rows=Math.ceil(n/perRow);
        const dx=(col-(Math.min(n-row*perRow,perRow)-1)/2)*64;
        const dy=(row-(rows-1)/2)*19;
        const lbl=p.noDeg?`${p.abbr}${p.retro?'℞':''}`:`${p.abbr}${String(Math.floor(p.deg||0)).padStart(2,'0')}${p.retro?'℞':''}`;
        s+=`<text x="${X(PL[h][0])+dx}" y="${Y(PL[h][1])+dy+4}" text-anchor="middle" fill="${PC[p.name]||'#7ecad8'}" font-size="16" font-weight="bold" font-family="Courier New">${lbl}</text>`;
      });
    }
    s+=`<text x="${X(.5)}" y="${Y(.545)}" text-anchor="middle" fill="#1a5a74" font-size="11" font-family="Courier New">${title} · ${subtitle}</text>`;
    return s+'</svg>';
  }

  const d9Planets=D.planets.map(p=>({...p,noDeg:true,h:((p.d9Sign-d9LagnaS+12)%12)+1,house:((p.d9Sign-d9LagnaS+12)%12)+1}));

  return`
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">
    <div class="pnl" style="flex:1;min-width:640px">
      <div class="ph"><span class="dot"></span>D1 — LAGNA CHART (NORTH INDIAN) · ${tzAbbr(S.date)} ${mtt(parseFloat(S.time)*60)} · ${LOC.name.toUpperCase()}</div>
      <div class="pb" style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">
        ${makeChart(D.planets,lagnaS,'D1',SABB[lagnaS]+' Lagna '+dmsC(D.ascSign.deg))}
        <div style="min-width:140px">
          <div style="color:var(--tx3);font-size:12px;letter-spacing:.07em;margin-bottom:7px">HOUSE OCCUPANCY</div>
          ${Array.from({length:12},(_,i)=>{
            const h=i+1,ps=D.planets.filter(p=>p.h===h);
            return`<div style="display:flex;gap:5px;margin-bottom:4px;align-items:center">
              <span style="color:#4ab8c8;font-size:12.5px;width:26px">H${h}</span>
              ${ps.length?ps.map(p=>`<span style="color:${PC[p.name]};font-size:13.5px;font-weight:700">${p.abbr}</span>`).join(' '):'<span style="color:var(--tx3);font-size:12.5px">—</span>'}
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
    <div class="pnl" style="flex:1;min-width:640px">
      <div class="ph"><span class="dot"></span>D9 — NAVAMSA CHART (NORTH INDIAN)</div>
      <div class="pb" style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">
        ${makeChart(d9Planets,d9LagnaS,'D9',SABB[d9LagnaS]+' Navamsa Lagna')}
        <div style="min-width:140px">
          <div style="color:var(--tx3);font-size:12px;letter-spacing:.07em;margin-bottom:7px">NAVAMSA STRENGTH</div>
          <table class="tbl" style="font-size:12.5px">
            <thead><tr><th>Planet</th><th>D1</th><th>D9</th><th></th></tr></thead>
            <tbody>
              ${D.planets.slice(0,9).map(p=>{
                const vm=p.s===p.d9Sign;
                return`<tr>
                  <td style="color:${PC[p.name]};font-weight:700">${p.abbr}</td>
                  <td style="color:var(--tx2)">${p.sign.slice(0,3)}</td>
                  <td style="color:var(--tx2)">${SIGNS[p.d9Sign].slice(0,3)}</td>
                  <td>${vm?'<span class="pill pb-b" style="font-size:12px;padding:1px 6px">Vargo.</span>':'<span style="color:var(--tx3)">—</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>`;
}

// pada start longitude (for NAVAMSA / SIGN band numbers)
function vrPadaLon(i28,p){
  if(i28===21)return ABHI_START+(p-1)*((ABHI_END-ABHI_START)/4)+0.01;
  const i27=i28<=20?i28:i28-1;
  return i27*NAK_SPAN+(p-1)*(NAK_SPAN/4)+0.01;
}

function tSBC(){
  const D=DATA;
  const com=CBYK[S.selectedCom]||COMMODITIES[0];
  const PAN=VR_PANCHAK[com.k];
  const VR=D.vr;
  const tzA=tzAbbr(S.date);

  // ── geometry ──
  const CW=102,CH=72,BT=52,ox=BT,oy=BT;
  const GW=9*CW,GH=9*CH,W=GW+2*BT,H=GH+2*BT+16;
  const px=sx=>ox+sx*(CW/4), py=sy=>oy+sy*(CH/4);
  const cellX=c=>ox+(c-1)*CW, cellY=r=>oy+(r-1)*CH;

  // ── re-cast rays per planet → cell hit tints + ray lines ──
  const nine=D.planets.filter(p=>['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn','Rahu','Ketu'].includes(p.name));
  const cellHits={};   // 'r,c' → {saum:n, krura:n}
  const rayLines=[];   // {planet,dir,pts,saum}
  const landMarks=[];  // {planet,x,y}
  const occ={};        // i28 → [planets]
  for(const p of nine){
    const pos=lonTo28(p.lon);
    (occ[pos.i28]=occ[pos.i28]||[]).push(p);
    const pp=(VR&&VR.perPlanet.find(q=>q.name===p.name))||{};
    const saum=pp.saum!==undefined?pp.saum:true;
    const dirs=pp.dirs||vrVedhaDirs(p.name,p.motion);
    for(const d of dirs){
      const ray=vrCastRay(pos.i28,pos.pada,d);
      ray.cells.forEach(cc=>{const o=cellHits[cc]=cellHits[cc]||{saum:0,krura:0};saum?o.saum++:o.krura++;});
      rayLines.push({planet:p.name,dir:d,pts:ray.pts,saum});
      if(ray.land)landMarks.push({planet:p.name,land:ray.land});
    }
    // कोण वेध cells count as hits too
    KONA_VEDHA.filter(k=>k.i28===pos.i28&&k.pada===pos.pada).forEach(k=>{
      const o=cellHits[k.cell]=cellHits[k.cell]||{saum:0,krura:0};saum?o.saum++:o.krura++;});
  }
  const panTargets=new Set([PAN.cell,TITHI_CELL[PAN.tithiGrp],RASHI_CELL[PAN.rashi],...(SVARA_CELLS[PAN.svara]||[])]);

  // ── SVG ──
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto" font-family="'Segoe UI','Nirmala UI','Noto Sans Devanagari','Mangal',sans-serif">`;
  svg+=`<rect width="${W}" height="${H}" fill="#010b0f" rx="4" stroke="#104050" stroke-width="1.5"/>`;

  // band cell helper
  const bandFill='#041820',bandTxt='#3a8aa0';
  // draw 9×9 cells
  for(let r=1;r<=9;r++)for(let c=1;c<=9;c++){
    const key=r+','+c, x=cellX(c), y=cellY(r);
    const isCorner=!!SBC_CORNERS[key];
    const isBorder=(r===1||r===9||c===1||c===9)&&!isCorner;
    const inner=SBC_INNER[key];
    let fill='#01101a',stroke='#0d3040',sw=.6;
    if(isCorner)fill='#020d14';
    if(inner){
      if(inner.type==='vow')fill='#031622';
      if(inner.type==='ltr')fill='#02131f';
      if(inner.type==='rashi')fill='#041a28';
      if(inner.type==='tv')fill='#071426';
    }
    // vedha tint
    const h=cellHits[key];
    if(h&&!isBorder&&!isCorner){
      if(h.saum&&h.krura)fill='#1a1030';
      else if(h.krura)fill='#1f0a10';      // क्रूर वेध → तेजी (red zone)
      else if(h.saum)fill='#06200f';       // सौम्य वेध → मंदी (green zone)
    }
    svg+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    // panchak target outline
    if(panTargets.has(key)){
      svg+=`<rect x="${x+1.5}" y="${y+1.5}" width="${CW-3}" height="${CH-3}" fill="none" stroke="#ffb300" stroke-width="1.3" stroke-dasharray="5 3"/>`;
    }
    // content
    if(isCorner){
      const cn=SBC_CORNERS[key];
      svg+=`<text x="${x+CW/2}" y="${y+CH/2-4}" text-anchor="middle" fill="#7ecad8" font-size="22" font-weight="bold">${cn.v}</text>`;
      svg+=`<text x="${x+CW/2}" y="${y+CH/2+13}" text-anchor="middle" fill="#1e5068" font-size="10.5" font-family="Courier New">${cn.dik} ${cn.en}</text>`;
    }else if(inner){
      if(inner.type==='vow'){
        svg+=`<text x="${x+CW/2}" y="${y+CH/2+1}" text-anchor="middle" fill="#6ab8d0" font-size="19" font-weight="bold">${inner.v}</text>`;
        svg+=`<text x="${x+CW/2}" y="${y+CH/2+15}" text-anchor="middle" fill="#16404f" font-size="9.5" font-family="Courier New">${inner.en}</text>`;
      }else if(inner.type==='ltr'){
        const extras=inner.letters.slice(1).join(' ');
        svg+=`<text x="${x+CW/2}" y="${y+CH/2-3}" text-anchor="middle" fill="#8fd8e8" font-size="19" font-weight="bold">${inner.main}</text>`;
        if(extras)svg+=`<text x="${x+CW/2}" y="${y+CH/2+13}" text-anchor="middle" fill="#3a7a90" font-size="12.5">${extras}</text>`;
        svg+=`<text x="${x+8}" y="${y+12}" fill="#16404f" font-size="9.5" font-family="Courier New">${inner.en}</text>`;
      }else if(inner.type==='rashi'){
        svg+=`<text x="${x+CW/2}" y="${y+CH/2-3}" text-anchor="middle" fill="#5aa8d8" font-size="13.5" font-weight="bold">${['मेष','वृष','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन'][inner.s]}</text>`;
        svg+=`<text x="${x+CW/2}" y="${y+CH/2+12}" text-anchor="middle" fill="#2a6080" font-size="10.5" font-family="Courier New">${SIGNS[inner.s].toUpperCase()} ${inner.s+1}</text>`;
      }else if(inner.type==='tv'){
        svg+=`<text x="${x+CW/2}" y="${y+13}" text-anchor="middle" fill="#d8b86a" font-size="11.5" font-weight="bold">${inner.grp} ${inner.en}</text>`;
        svg+=`<text x="${x+CW/2}" y="${y+26}" text-anchor="middle" fill="#8a7a50" font-size="10.5">${inner.varaH}</text>`;
        svg+=`<text x="${x+CW/2}" y="${y+39}" text-anchor="middle" fill="#6a8a9a" font-size="10.5" font-family="Courier New">${inner.vara.join(', ')}</text>`;
        svg+=`<text x="${x+CW/2}" y="${y+53}" text-anchor="middle" fill="#9ab0c0" font-size="11.5" font-family="Courier New">${inner.tithis}</text>`;
      }
    }
  }
  // border nakshatra cells (content + occupancy highlight + pada ticks)
  for(let i=0;i<28;i++){
    const nk=VR28[i],x=cellX(nk.c),y=cellY(nk.r);
    const ps=occ[i]||[];
    const isComNak=i===PAN.i28;
    if(ps.length){
      const col=PC[ps[0].name]||'#00c870';
      svg+=`<rect x="${x+1}" y="${y+1}" width="${CW-2}" height="${CH-2}" fill="${col}22" stroke="${col}" stroke-width="1.1"/>`;
    }
    if(isComNak){
      svg+=`<rect x="${x+2.5}" y="${y+2.5}" width="${CW-5}" height="${CH-5}" fill="none" stroke="#ffb300" stroke-width="1.4" stroke-dasharray="5 3"/>`;
    }
    // pada tick marks on outer edge
    for(let k=1;k<4;k++){
      if(nk.side==='T')svg+=`<line x1="${x+k*CW/4}" y1="${y}" x2="${x+k*CW/4}" y2="${y+5}" stroke="#1a4a5a" stroke-width=".6"/>`;
      if(nk.side==='B')svg+=`<line x1="${x+k*CW/4}" y1="${y+CH-5}" x2="${x+k*CW/4}" y2="${y+CH}" stroke="#1a4a5a" stroke-width=".6"/>`;
      if(nk.side==='L')svg+=`<line x1="${x}" y1="${y+k*CH/4}" x2="${x+5}" y2="${y+k*CH/4}" stroke="#1a4a5a" stroke-width=".6"/>`;
      if(nk.side==='R')svg+=`<line x1="${x+CW-5}" y1="${y+k*CH/4}" x2="${x+CW}" y2="${y+k*CH/4}" stroke="#1a4a5a" stroke-width=".6"/>`;
    }
    const occCol=ps.length?(PC[ps[0].name]||'#7ecad8'):null;
    svg+=`<text x="${x+CW/2}" y="${y+14}" text-anchor="middle" fill="${occCol||(isComNak?'#ffb300':'#3a8ab0')}" font-size="10.5" font-weight="bold" font-family="Courier New">${nk.n.toUpperCase().slice(0,11)}</text>`;
    svg+=`<text x="${x+CW/2}" y="${y+28}" text-anchor="middle" fill="#5a9ab8" font-size="12.5">${nk.h}</text>`;
    svg+=`<text x="${x+CW/2}" y="${y+41}" text-anchor="middle" fill="${nk.l!=='—'?(PC[nk.l]||'#444'):'#2a4a5a'}" font-size="10.5" font-weight="bold" font-family="Courier New">${nk.l!=='—'?PA[nk.l]:'—'}</text>`;
    // occupying planets row
    ps.forEach((p,j)=>{
      const pos=lonTo28(p.lon);
      svg+=`<text x="${x+10+j*26}" y="${y+CH-7}" fill="${PC[p.name]}" font-size="11.5" font-weight="bold" font-family="Courier New">${p.abbr}${p.retro?'℞':''}<tspan fill="#4a7a90" font-size="9.5">${pos.pada}</tspan></text>`;
    });
  }
  // ── vedha rays ──
  for(const rl of rayLines){
    const[x0,y0,x1,y1]=rl.pts;
    const col=PC[rl.planet]||'#888';
    const dash=rl.dir==='front'?'':rl.dir==='left'?'7 3':'2 3';
    svg+=`<line x1="${px(x0)}" y1="${py(y0)}" x2="${px(x1)}" y2="${py(y1)}" stroke="${col}" stroke-width="1.4" opacity="0.8" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
    svg+=`<circle cx="${px(x1)}" cy="${py(y1)}" r="2.6" fill="${col}" opacity="0.9"/>`;
  }
  // planet anchors (marker dots on border)
  for(const p of nine){
    const pos=lonTo28(p.lon);const a=vrAnchor(pos.i28,pos.pada);
    svg+=`<circle cx="${px(a.x)}" cy="${py(a.y)}" r="6.5" fill="${PC[p.name]}" stroke="#000" stroke-width="1"/>`;
    svg+=`<text x="${px(a.x)}" y="${py(a.y)+3}" text-anchor="middle" fill="#000" font-size="9" font-weight="bold" font-family="Courier New">${p.abbr}</text>`;
  }
  // ── bands: PADA + NAVAMSA numbers + SIGN spans ──
  const sideNaks={T:[2,3,4,5,6,7,8].map(c=>VR28.findIndex(n=>n.side==='T'&&n.c===c)),
                  B:[2,3,4,5,6,7,8].map(c=>VR28.findIndex(n=>n.side==='B'&&n.c===c)),
                  L:[2,3,4,5,6,7,8].map(r=>VR28.findIndex(n=>n.side==='L'&&n.r===r)),
                  R:[2,3,4,5,6,7,8].map(r=>VR28.findIndex(n=>n.side==='R'&&n.r===r))};
  function bandSlots(side){ // 28 slots in DISPLAY order → {pada,nav,sign}
    const out=[];
    for(const i of sideNaks[side]){
      const seq=(side==='B'||side==='L')?[4,3,2,1]:[1,2,3,4];
      for(const p of seq){
        const lon=vrPadaLon(i,p);
        out.push({pada:p,nav:getD9(lon)+1,sign:Math.floor(n360(lon)/30)});
      }
    }
    return out;
  }
  const SGH=['मेष','वृष','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन'];
  for(const side of['T','B','L','R']){
    const slots=bandSlots(side);
    const horiz=(side==='T'||side==='B');
    const u=horiz?CW/4:CH/4;
    const base=horiz?cellX(2):cellY(2);
    // pada row & navamsa row & sign band positions
    let padaPos,navPos,signPos;
    if(side==='T'){padaPos=oy-14;navPos=oy-28;signPos=oy-44;}
    if(side==='B'){padaPos=oy+GH+11;navPos=oy+GH+25;signPos=oy+GH+41;}
    if(side==='L'){padaPos=ox-14;navPos=ox-28;signPos=ox-44;}
    if(side==='R'){padaPos=ox+GW+11;navPos=ox+GW+25;signPos=ox+GW+41;}
    slots.forEach((sl,j)=>{
      const m=base+j*u+u/2;
      if(horiz){
        svg+=`<text x="${m}" y="${padaPos}" text-anchor="middle" fill="#2a5a70" font-size="9" font-family="Courier New">${sl.pada}</text>`;
        svg+=`<text x="${m}" y="${navPos}" text-anchor="middle" fill="#3a7a95" font-size="9" font-family="Courier New">${sl.nav}</text>`;
      }else{
        svg+=`<text x="${padaPos}" y="${m+2.5}" text-anchor="middle" fill="#2a5a70" font-size="9" font-family="Courier New">${sl.pada}</text>`;
        svg+=`<text x="${navPos}" y="${m+2.5}" text-anchor="middle" fill="#3a7a95" font-size="9" font-family="Courier New">${sl.nav}</text>`;
      }
    });
    // sign spans
    let i0=0;
    while(i0<28){
      let i1=i0;while(i1+1<28&&slots[i1+1].sign===slots[i0].sign)i1++;
      const a=base+i0*u, b=base+(i1+1)*u, sgn=slots[i0].sign, wide=(b-a)>56;
      const lbl=wide?`${SIGNS[sgn].toUpperCase()} (${SGH[sgn]}) ${sgn+1}`:`${SABB[sgn]} ${sgn+1}`;
      if(horiz){
        svg+=`<rect x="${a}" y="${signPos-10}" width="${b-a}" height="13" fill="#06222e" stroke="#0d3040" stroke-width=".5"/>`;
        svg+=`<text x="${(a+b)/2}" y="${signPos}" text-anchor="middle" fill="#4a9ab8" font-size="${wide?8.5:7.5}" font-family="Courier New">${lbl}</text>`;
      }else{
        svg+=`<rect x="${signPos-7}" y="${a}" width="13" height="${b-a}" fill="#06222e" stroke="#0d3040" stroke-width=".5"/>`;
        svg+=`<text x="${signPos}" y="${(a+b)/2}" text-anchor="middle" fill="#4a9ab8" font-size="9" font-family="Courier New" transform="rotate(${side==='L'?-90:90} ${signPos} ${(a+b)/2})">${lbl}</text>`;
      }
      i0=i1+1;
    }
  }
  // direction + vedha-side labels (as in the canonical chart)

  // ── forecast panel pieces ──
  const limbIcons=h=>['varna','svara','tithi','nak','rashi'].map(k=>{

  // ── 15-MIN HEATMAP ──
  let heat=[];try{heat=vrHeatmap(S.date,com.k,S.ayMode);}catch(e){console.error('heat',e);}
  const maxAbs=Math.max(0.5,...heat.map(h=>Math.abs(h.net)));
  const curMin=parseFloat(S.time)*60;
  const isMcxLoc=LOC.mkt==='MCX';
  const rk=vrRahuKala(D); // राहु-काल — "भरपूर तेजी में भी उस समय मंदी अवश्य" (पृ. ५९)
  let heatHTML='';
  if(heat.length){
    const hdr=Array.from({length:24},(_,h)=>`<div style="font-size:10px;color:var(--tx3);text-align:center">${String(h).padStart(2,'0')}</div>`).join('');
    let rows='';
    for(let q=0;q<4;q++){
      let cells='';
      for(let h=0;h<24;h++){

        const cur=Math.abs(sl.min-curMin)<7.5;
        const inRK=(sl.min+15)>rk.start&&sl.min<rk.end;
        const mcxOpen=isMcxLoc?(sl.min>=MCX_OPEN_MIN&&sl.min<=MCX_CLOSE_MIN):true;

        </div>
